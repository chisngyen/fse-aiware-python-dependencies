<script>
const CATS = {"p1":"1. Bài toán","p2":"2. RoadFury","p3":"3. SE2RoadNet","p4":"4. Kết quả","p5":"5. Hạn chế","math":"6. Toán / Backup"};

// ==================== NGÂN HÀNG GIẢI THÍCH ====================
// Nguyên tắc: KHÔNG lặp lại thứ đã in trên slide. Mỗi entry = một điểm
// thầy có thể chỉ vào slide và bảo "giải thích đi": vì sao / cơ chế / ý nghĩa.
// q: điểm cần giải thích · slide: slide nào · ord: thứ tự duyệt · keys: từ khóa thêm
const DB = [{"q":"Vì sao bài toán là 'xếp đúng thứ tự' chứ không phải 'chạy mô phỏng nhanh hơn'? Chạy song song nhiều máy có giải quyết được không?","cat":"p1","slide":"BÀI TOÁN 03","ord":1,"keys":"uu tien thu tu prioritization apfd chay nhanh parallel ngan sach budget mo phong simulation","a":"Nút thắt không nằm ở tốc độ mỗi test mà ở tổng ngân sách: <b>956</b> kịch bản, mỗi cái là mô phỏng vật lý BeamNG tốn nhiều giờ, chạy hết thì quá đắt. Song song chỉ chia thời gian chứ không giảm tổng số giờ máy phải trả. Prioritization tấn công đúng chỗ khác: nếu xếp các kịch bản dễ FAIL lên đầu hàng đợi thì chạy phần đầu đã lộ phần lớn lỗi, có thể dừng sớm mà vẫn tìm được hầu hết fault. Nói cách khác ta tối ưu <b>thứ tự phát hiện lỗi</b> trên cùng một ngân sách, không phải rút ngắn từng test."},{"q":"APFD được định nghĩa thế nào và vì sao xếp tốt lại cho đường cong dốc?","cat":"p1","slide":"BÀI TOÁN 03","ord":2,"keys":"apfd cong thuc formula duong cong dpoint tf fault position area detection","a":"APFD(π)=1−(ΣTFᵢ)/(n·m)+1/(2n), với n test, m kịch bản FAIL, TFᵢ là vị trí trong hàng đợi mà fault thứ i lộ ra. Trực giác: nếu mọi FAIL bị đẩy về cuối hàng đợi thì ΣTFᵢ lớn, APFD thấp; nếu dồn FAIL lên đầu thì TFᵢ nhỏ, APFD tiến về 1. Đường cong 'số lỗi tìm được theo số test đã chạy' vì thế dốc đứng ở đầu, nghĩa là phát hiện phần lớn lỗi chỉ sau một phần nhỏ hàng đợi. Mốc tham chiếu: Random khoảng <b>0.52</b>, SE2RoadNet khoảng <b>0.80</b>, ideal khoảng <b>0.95</b>."},{"q":"Điều gì làm bài toán khó về bản chất, khi input chỉ là một chuỗi điểm 2D?","cat":"p1","slide":"BÀI TOÁN 02","ord":3,"keys":"kho challenge chi hinh hoc geometry khong hanh vi xe vehicle behavior input diem 2d point","a":"Scorer f_θ phải dự đoán xác suất FAIL chỉ từ <b>hình học đường</b>: một chuỗi R={p1..pN} trong R², N thay đổi <b>64-197</b> điểm, hoàn toàn không có phản ứng xe (tốc độ, góc lái, quỹ đạo thực). Nhãn FAIL/PASS lại sinh ra từ động lực học xe khi chạy mô phỏng, tức là ta phải suy ngược một kết quả vật lý từ một mô tả tĩnh. Thêm nữa số điểm N biến thiên và cùng một con đường có thể được lấy mẫu dày/thưa hay xoay hướng khác nhau mà nhãn không đổi, nên model dễ bám vào đặc trưng bề mặt thay vì hình dạng thật của đường."},{"q":"Các mốc Random ~0.52, SE2RoadNet ~0.80, ideal ~0.95 nói lên điều gì? Có phải cứ trên 0.5 là tốt?","cat":"p1","slide":"BÀI TOÁN 03","ord":4,"keys":"random baseline ideal upper bound 0.52 0.80 0.95 mode tham chieu apfd","a":"Random khoảng <b>0.52</b> là sàn: xếp ngẫu nhiên thì fault rải đều nên APFD quanh 0.5, đây là mức 'không biết gì'. Ideal khoảng <b>0.95</b> là trần: xếp mọi FAIL lên đầu, không thể cao hơn nhiều vì với m FAIL trong n test vẫn còn phần 1/(2n). SE2RoadNet khoảng <b>0.80</b> nằm giữa, tức là đã thu hẹp được phần lớn khoảng cách sàn-trần chứ không chỉ 'hơn random'. Vì thế không nên đọc APFD như phần trăm; điều đáng nhìn là vị trí trong dải [0.52, 0.95], và mỗi điểm APFD ở vùng cao đổi ra rất nhiều giờ mô phỏng tiết kiệm được."},{"q":"Vì sao tập Competition được gọi là out-of-distribution, và distribution shift ở đây cụ thể là gì?","cat":"p1","slide":"BÀI TOÁN 04","ord":5,"keys":"ood out of distribution shift sensodat competition test do dai length 129 229 hep narrow generalize","a":"SensoDat chia Train <b>28804</b> (38.4% FAIL, dài 61-454m), val <b>7202</b> (38.4%, 76-433m), Test/Competition <b>956</b> (36.9% FAIL, dài 129-229m). Shift nằm ở phân bố độ dài: train/val trải rất rộng (tới 454m) còn Competition bị bó vào dải <b>hẹp 129-229m</b>, đồng thời tỉ lệ FAIL tụt nhẹ từ 38.4% xuống 36.9%. Nghĩa là model không được chấm trên cùng phân bố nó học, mà phải tổng quát hóa sang vùng độ dài chưa từng thấy nhiều. Đây là lý do một model fit tốt train vẫn có thể trôi điểm trên Competition nếu nó học đặc trưng phụ thuộc phân bố thay vì hình học thật."},{"q":"Dữ liệu cho thấy 'đường càng dài càng dễ FAIL'. Đây có phải một shortcut nguy hiểm mà model có thể lợi dụng không?","cat":"p1","slide":"BÀI TOÁN 04","ord":6,"keys":"shortcut confound do dai length correlation fail bias competition hep generalize phan bien","a":"Đúng là một rủi ro, và deck tự nêu ra nó. Trên train độ dài tương quan thuận với FAIL, nên một model lười có thể chỉ xếp theo độ dài mà vẫn được APFD kha khá, đây là shortcut chứ không phải hiểu hình dạng đường. Điểm cứu là chính tập Competition: độ dài bị bó vào dải hẹp <b>129-229m</b>, làm tín hiệu 'độ dài' gần như bằng phẳng và vô hiệu hóa shortcut. Nếu một method chỉ ăn điểm nhờ độ dài, nó sẽ tụt mạnh trên OOD; ngược lại method giữ được điểm trên Competition mới chứng minh nó đọc được chicane/độ gắt của khúc cua chứ không phải đếm mét."},{"q":"Ba hướng related work khác nhau ở đâu, và vì sao 'đa dạng' (diversity) không đồng nghĩa với 'lộ lỗi'?","cat":"p1","slide":"06-07","ord":7,"keys":"related work search based diversity feature ml transformer so-sdc its4sdc roadfury da dang fault reveal","a":"Có ba hướng.<br>• <b>Search-based/diversity</b> (SO-SDC-Prioritizer GA, Graph Selector, Greedy-diversity): chọn tập test đa dạng, ưu là không cần nhãn nhưng đa dạng hình học không đảm bảo lộ lỗi, hai đường rất khác nhau vẫn có thể cùng PASS.<br>• <b>Feature-based ML</b> (ITS4SDC LSTM): vài đặc trưng đường + mạng chuỗi gọn, rẻ và dễ giải thích nhưng ít đặc trưng và phụ thuộc khung tọa độ.<br>• <b>Deep graph/sequence/Transformer</b> (RoadFury): APFD cao nhất <b>0.804</b> nhưng không bất biến, xoay hay đổi tần số lấy mẫu là điểm trôi.<br>Bảng APFD: Random 0.493, GA 0.765, LSTM 0.781, RoadFury 0.804, SE2RoadNet 0.805."},{"q":"Khoảng trống mà bài toán nhắm tới là gì, và vì sao 'bất biến với phép xoay và tần số lấy mẫu' lại quan trọng đến vậy?","cat":"p1","slide":"07","ord":8,"keys":"khoang trong gap invariance rotation xoay sampling lay mau se2 equivariant augmentation xap xi hoi dong giao su cau kho kho","a":"Khoảng trống: chưa method nào <b>đảm bảo</b> bất biến với phép xoay và tần số lấy mẫu, tất cả hoặc dựa augmentation (chỉ xấp xỉ) hoặc dùng đặc trưng phụ thuộc khung tọa độ. Điều này quan trọng vì nhãn FAIL/PASS là thuộc tính vật lý của hình dạng đường: xoay cả con đường 30 độ hay lấy mẫu dày gấp đôi thì xe vẫn lệch làn ở đúng khúc cua đó, nhãn không đổi. Nếu model đổi dự đoán khi input xoay/đổi mật độ điểm thì nó đang học hệ tọa độ chứ không học đường, và sẽ trôi điểm trên OOD. Đảm bảo bất biến bằng thiết kế (SE(2)-equivariant, Δ=0) mạnh hơn augmentation vì augmentation chỉ phạt sai lệch chứ không loại bỏ nó."},{"q":"Bảng related work cho thấy RoadFury 0.804 và SE2RoadNet 0.805, gần như bằng nhau. Vậy đóng góp thực sự là gì, chỉ hơn 0.001?","cat":"p1","slide":"07","ord":9,"keys":"roadfury se2roadnet 0.804 0.805 rotation delta bat bien invariance dong gop phan bien equivariant hoi dong giao su cau kho rat kho","a":"Con số APFD gần bằng nhau nhưng cột phân biệt là <b>Rotation Δ</b>: tất cả baseline (kể cả RoadFury) đánh dấu ✗ vì xoay input làm điểm trôi, còn SE2RoadNet đạt ✓ với <b>Δ=0</b>. Đóng góp không phải '+0.001 APFD' mà là đạt mức APFD hàng đầu <b>bằng đảm bảo cấu trúc</b> thay vì bằng augmentation may rủi. RoadFury cao nhờ SWA và fit mạnh nhưng dễ vỡ khi phân bố xoay/lấy mẫu đổi; SE2RoadNet cho cùng dự đoán dưới mọi phép xoay theo thiết kế. Trên Competition OOD (956 test, 30 trials), tính chất bất biến này mới là thứ giữ điểm ổn định, đó là điểm cần nhấn khi thầy nói 'chỉ hơn 0.001'."},{"q":"Vì sao phải bất biến với tần số lấy mẫu khi input đã là một chuỗi điểm cố định? Chẳng phải cứ nội suy về cùng số điểm là xong?","cat":"p1","slide":"BÀI TOÁN 02","ord":10,"keys":"tan so lay mau sampling frequency resample noi suy interpolation N 64 197 bien thien invariance hoi dong giao su cau kho kho","a":"Chuỗi không cố định: N thay đổi <b>64-197</b> điểm giữa các kịch bản, và cùng một con đường có thể được lấy mẫu dày hay thưa mà hình dạng vật lý không đổi. Nội suy về cùng số điểm nghe hợp lý nhưng chính bước resample là một phép biến đổi làm dịch/nhòe vị trí điểm, một model nhạy với mật độ điểm sẽ đổi dự đoán chỉ vì cách rời rạc hóa khác nhau, không phải vì đường khác nhau. Bất biến tần số lấy mẫu nghĩa là scorer cho cùng điểm số dù đường được biểu diễn bởi 64 hay 197 điểm, miễn hình dạng như nhau. Đây là điều augmentation khó phủ hết vì không gian cách lấy mẫu quá lớn, nên đảm bảo bằng kiến trúc mạnh hơn."},{"q":"Vì sao 10 kênh đặc trưng f0..f9 lại đủ để RoadTransformer đạt APFD cao nhất? Mỗi kênh nắm bắt tính chất hình học gì?","cat":"p2","slide":"09","ord":11,"keys":"kenh dac trung feature channels f0 f9 curvature do cong menger jerk cung tich luy hinh hoc geometry","a":"10 kênh mã hóa hình học đường ở nhiều bậc đạo hàm:<br>• <b>f0</b> chiều dài đoạn<br>• <b>f1</b> biến thiên góc |Δθ|<br>• <b>f2</b> độ cong Menger κ<br>• <b>f3</b> Δκ (jerk, đạo hàm của cong)<br>• <b>f9</b> Δ²κ (gia tốc cong)<br>• <b>f4</b> vị trí tương đối trên đường (s/L)<br>• <b>f8</b> σ(κ) đo độ gồ ghề cục bộ<br>Nhóm này bắt được chỗ đường ngoặt gấp, đổi cong đột ngột, chính là nơi xe tự lái dễ lỗi, nên đủ tín hiệu để chấm điểm ưu tiên test. Bằng chứng: APFD <b>0.804±0.012</b>, AUC <b>0.917</b> trên 956 test, tốt nhất competition."},{"q":"Tại sao gọi f5 (sinθ), f6 (cosθ), f7 (θ) là 'phụ thuộc khung quy chiếu'? Sự khác biệt bản chất giữa chúng và các kênh còn lại là gì?","cat":"p2","slide":"09","ord":12,"keys":"phu thuoc khung quy chieu frame dependent sin cos theta huong tuyet doi absolute heading bat bien invariant","a":"f5, f6, f7 đều tính từ <b>hướng tuyệt đối θ</b> của đoạn đường so với trục tọa độ toàn cục. Nếu ta xoay cả đường đi vài độ, θ đổi, kéo theo sinθ và cosθ đổi, dù hình dạng đường (độ cong, chiều dài) không hề thay đổi. Ngược lại các kênh như Δs, κ, dκ/ds chỉ phụ thuộc quan hệ nội tại giữa các điểm nên bất biến với phép xoay/tịnh tiến. Đây chính là mầm mống của điểm mù 1: model học được thông tin không nên phụ thuộc vào."},{"q":"Learned PE dùng vị trí tuyệt đối gây điểm mù thứ hai như thế nào? Vì sao nó nhạy với tần số lấy mẫu?","cat":"p2","slide":"09","ord":13,"keys":"positional encoding vi tri tuyet doi absolute PE tan so lay mau sampling rate diem mu 2 discretization roi rac hoa","a":"RoadTransformer gán learned PE theo <b>chỉ số token tuyệt đối</b> (token thứ 0, 1, 2...). Cùng một đường vật lý nếu lấy mẫu 64 điểm hay 197 điểm thì cùng một khúc cua sẽ rơi vào các chỉ số khác nhau, nên PE gán cho nó khác nhau và điểm số thay đổi theo cách rời rạc hóa. Model đang gắn ý nghĩa vào thứ tự đánh số điểm thay vì vào vị trí cung thực sự. Đây là điểm mù nhạy tần số lấy mẫu, một thuộc tính không nên ảnh hưởng tới xếp hạng test."},{"q":"APFD 0.804 đã cao nhất competition rồi, vì sao vẫn nói RoadFury 'không có bảo chứng bất biến'? Điểm cao và bất biến khác nhau chỗ nào?","cat":"p2","slide":"09-10","ord":14,"keys":"bao chung bat bien guarantee invariance apfd cao khong dam bao empirical vs architectural thuc nghiem kien truc","a":"APFD cao chỉ nói model làm tốt <b>trên phân phối test cụ thể</b> của competition, đó là bằng chứng thực nghiệm. 'Bảo chứng bất biến' là tính chất kiến trúc: cùng một đường, dù xoay hay lấy mẫu lại, phải cho cùng điểm số. RoadFury không có tính chất này vì 3/10 kênh và PE đều phụ thuộc khung quy chiếu. Nghĩa là điểm cao có thể một phần đến từ việc khớp quy ước tọa độ của dataset, và sẽ lung lay khi gặp đường bị xoay/lấy mẫu khác. Cao không đồng nghĩa với đúng vì lý do đúng."},{"q":"Vì sao chọn cách 'mỗi điểm mù → một thành phần SE2RoadNet' thay vì refactor lại toàn bộ mạng cho gọn?","cat":"p2","slide":"10","ord":15,"keys":"va co chu dich targeted patch mot diem mu mot thanh phan refactor mu attribution quy trach nhiem se2roadnet","a":"Đây là vá có chủ đích để giữ được <b>quy trách nhiệm</b>: điểm mù 1 (nhạy xoay) được vá riêng bằng bộ 7 kênh bất biến SE(2), điểm mù 2 (nhạy lấy mẫu) được vá riêng bằng attention bias theo Δs. Khi mỗi thay đổi kiến trúc ứng với đúng một lỗi đã chẩn đoán, ta có thể ablation để chứng minh từng thành phần thật sự sửa đúng thất bại của nó (đúng tinh thần G5/G2: mỗi thành phần phải trả lời nó vá lỗi gì). Refactor mù trộn nhiều thay đổi lại, mất khả năng chỉ ra cái nào có công."},{"q":"Hãy giải thích cơ chế vá điểm mù nhạy phép xoay: '7 kênh bất biến SE(2)' hoạt động ra sao và bằng chứng nào cho thấy điểm mù có thật?","cat":"p2","slide":"10","ord":16,"keys":"nhay phep xoay rotation sensitive se2 7 kenh bat bien invariant its4sdc delta 0.057 xoay 30 90 do hoi dong giao su cau kho kho","a":"Bằng chứng điểm mù: lấy cùng một đường rồi xoay 30° hoặc 90°, điểm số RoadFury trồi lên, trên ITS4SDC đo được <b>Δ=0.057</b>, tức xếp hạng đổi chỉ vì đổi hệ tọa độ. Cách vá là bỏ hẳn 3 kênh phụ thuộc hướng (sinθ, cosθ, θ) và chỉ giữ <b>7 kênh bất biến SE(2)</b> như Δs, κ, dκ/ds. Các đại lượng này định nghĩa từ quan hệ nội tại giữa các điểm nên phép xoay/tịnh tiến (nhóm SE(2)) không làm chúng đổi. Kết quả: model không còn đầu vào nào mang thông tin hướng tuyệt đối, nên bất biến xoay được đảm bảo ngay ở tầng đặc trưng."},{"q":"Attention bias theo Δs khác gì learned PE tuyệt đối, và vì sao nó khiến model bất biến với cách tham số hóa đường?","cat":"p2","slide":"10","ord":17,"keys":"attention bias delta s hieu so cung arc length va diem mu 2 sampling positional encoding bat bien tham so hoa","a":"Learned PE gán vị trí theo chỉ số token tuyệt đối, nên đổi số điểm lấy mẫu là đổi tín hiệu. Bản vá thay bằng <b>attention bias tính từ hiệu số chiều dài cung Δs giữa hai điểm</b>: hai token gần nhau về khoảng cách cung thì tương tác mạnh, bất kể chúng là token thứ mấy. Vì Δs là đại lượng vật lý của đường chứ không phải chỉ số đánh số, cùng một đường lấy mẫu 64 hay 197 điểm vẫn cho cùng cấu trúc quan hệ, nên điểm số ổn định. Bản chất là chuyển bất biến từ 'thứ tự đếm' sang 'hình học cung'."},{"q":"Vì sao nói đây là 'paradigm shift từ augmentation sang ràng buộc kiến trúc'? Hai cách chống nhạy khung quy chiếu khác nhau ở đâu?","cat":"p2","slide":"10","ord":18,"keys":"paradigm shift augmentation xap xi rang buoc kien truc architectural constraint bao chung guarantee approximate","a":"Cách phổ biến để chống nhạy xoay/lấy mẫu là <b>data augmentation</b>: xoay và resample thêm dữ liệu rồi huấn luyện, hy vọng model tự học tính bất biến. Nhưng đó chỉ là xấp xỉ, không có bảo chứng, model vẫn có thể lệch khi gặp phép biến đổi ngoài phân phối augment. SE2RoadNet chuyển sang <b>ràng buộc kiến trúc</b>: bỏ mọi đầu vào phụ thuộc khung và mã hóa vị trí bằng Δs, khiến bất biến trở thành tính chất toán học của mạng, đúng theo thiết kế chứ không phải học được. Đổi từ 'hy vọng đúng' sang 'đảm bảo đúng'."},{"q":"Vì sao bài toán dự đoán failure của road test lại cần bất biến SE(2), thay vì để model tự học từ data?","cat":"p3","slide":"12","ord":19,"keys":"bat bien se2 invariance ly do why road test failure diem so khong doi","a":"Một con đường có failure hay không là tính chất VẬT LÝ của hình học đường, không phụ thuộc bạn đặt gốc tọa độ ở đâu hay xoay bản đồ thế nào. Nếu model cho điểm khác nhau khi ta xoay/tịnh tiến cùng một đường, đó là model đang học nhiễu tọa độ chứ không phải học độ khó thực. Ép bất biến SE(2) loại bỏ toàn bộ bậc tự do giả này, nên model chỉ còn cách học đúng tín hiệu hình học. Đây là prior đúng với bản chất bài toán, không phải trick."},{"q":"Định lý bất biến phát biểu 'BIT-IDENTICAL với mọi (R,t)'. Bit-identical mạnh hơn 'gần bằng' ở chỗ nào, và vì sao đạt được?","cat":"p3","slide":"12","ord":20,"keys":"bit identical bat bien kien truc dinh ly f theta R t score 0.8047 rotation hoi dong giao su cau kho kho","a":"Bit-identical nghĩa là output không chỉ xấp xỉ mà TRÙNG tới từng bit khi xoay, tịnh tiến hoặc đổi gốc tham số hóa đường, minh họa bằng một đường qua 4 phép biến đổi đều cho đúng Score=<b>0.8047</b>. Đạt được vì bất biến là tính chất của KIẾN TRÚC: đầu vào chỉ gồm đại lượng nội tại (Δs, κ...) vốn không đổi dưới SE(2), nên phép biến đổi tọa độ bị triệt tiêu trước khi vào mạng. Khác hẳn data augmentation vốn chỉ cho bất biến gần đúng, có sai số và phụ thuộc mẫu train. Ở đây sai số bằng 0 theo đúng nghĩa toán học."},{"q":"Rotation probe cho ΔAPFD=0.0000. Con số 0 tuyệt đối này chứng minh điều gì, và thầy có thể vặn nó thế nào?","cat":"p3","slide":"11","ord":21,"keys":"rotation probe delta apfd 0.0000 chung minh bat bien empirical proof xoay hoi dong giao su cau kho kho","a":"ΔAPFD=<b>0.0000</b> là kiểm chứng thực nghiệm rằng bất biến không chỉ nằm trên giấy: xoay toàn bộ tập test rồi đo lại, ranking failure không đổi một chút nào nên APFD y hệt. Điểm mạnh phản biện: nếu bất biến đến từ augmentation thì probe sẽ ra một số nhỏ khác 0, còn ở đây đúng bằng 0 xác nhận nó là bất biến cấu trúc. Nếu thầy vặn 'sao chắc code đúng', ta trả lời chính probe này là bài test bất biến, và giá trị 0 tuyệt đối (không phải 1e-6) loại trừ khả năng chỉ là trùng hợp số học."},{"q":"Bất biến bằng KIẾN TRÚC khác gì data augmentation, và vì sao ta chọn hướng khó hơn này?","cat":"p3","slide":"12","ord":22,"keys":"kien truc vs data augmentation bat bien architecture guarantee xoay tang cuong du lieu hoi dong giao su cau kho rat kho","a":"Data augmentation dạy model bất biến bằng cách cho xem nhiều bản xoay, nên bất biến chỉ đúng gần đúng, tốn thêm data, và không có bảo đảm ngoài phân phối train. Bất biến bằng kiến trúc thì đúng với MỌI phép biến đổi, kể cả góc chưa từng thấy, vì đặc trưng đầu vào đã bất biến sẵn từ khâu feature. Cái giá phải trả là ta phải thiết kế lại feature (chỉ dùng đại lượng nội tại) và attention bias (theo Δs), khó hơn về mặt kỹ thuật. Đổi lại được bảo đảm cứng, ít tham số hơn augmentation, và probe ΔAPFD=0.0000 xác nhận."},{"q":"Vì sao 7 kênh đặc trưng phải là đại lượng NỘI TẠI, và vì sao bỏ hẳn sinθ, cosθ, θ?","cat":"p3","slide":"13","ord":23,"keys":"7 kenh noi tai intrinsic delta s kappa bo sin cos theta khung frame dependent","a":"Bảy kênh, tất cả tính trên cặp điểm liền kề nên KHÔNG đổi khi xoay hay tịnh tiến:<br>• Δs<br>• |Δθ|<br>• κ có dấu<br>• dκ/ds<br>• d²κ/ds²<br>• s_norm<br>• σ_local(κ)<br>Ngược lại sinθ, cosθ, θ là góc so với trục tọa độ tuyệt đối, xoay đường một chút là chúng đổi ngay, tức là kênh phụ thuộc khung. Chỉ cần một kênh phụ thuộc khung lọt vào là bất biến vỡ hoàn toàn. Nên ta bỏ sạch chúng để có 0 kênh frame-dependent, đảm bảo bất biến ngay từ đầu vào, trước khi model học bất cứ gì."},{"q":"Độ cong κ được lấy CÓ DẤU chứ không phải |κ|. Dấu mang thông tin gì mà nếu bỏ đi sẽ mất?","cat":"p3","slide":"13","ord":24,"keys":"kappa co dau signed curvature trai phai chieu ngoat thong tin","a":"κ=Δθ/Δs có dấu phân biệt đường ngoặt trái với ngoặt phải, còn |κ| gộp cả hai thành một. Với dự đoán failure điều này quan trọng vì một chuỗi ngoặt cùng chiều (xoáy ốc) khác hẳn chuỗi ngoặt đổi chiều liên tục (ziczac) về độ khó lái, dù |κ| có thể giống nhau. Giữ dấu vẫn bất biến SE(2) vì xoay/tịnh tiến không đổi chiều cong tương đối dọc đường. Bỏ dấu sẽ mất khả năng phân biệt các dạng hình học nguy hiểm khác nhau."},{"q":"Tại sao cần đến đạo hàm bậc cao dκ/ds và d²κ/ds² (geometric jerk), chứ κ chưa đủ?","cat":"p3","slide":"13","ord":25,"keys":"dkappa ds d2 kappa jerk hinh hoc dao ham bac cao rate of change curvature","a":"κ cho biết đường đang cong bao nhiêu, nhưng failure thường đến từ sự THAY ĐỔI đột ngột của độ cong chứ không phải độ cong tĩnh. dκ/ds (jerk hình học) bắt được đoạn chuyển từ thẳng sang cong gấp, và d²κ/ds² bắt được mức độ giật của chính sự thay đổi đó, đây là những chỗ xe dễ mất kiểm soát. Các đạo hàm này vẫn nội tại theo arclength nên giữ bất biến. Thêm σ_local(κ) trên cửa sổ 11 để đo mức dao động cục bộ của độ cong, bổ sung góc nhìn thống kê cho các đạo hàm điểm."},{"q":"Kiến trúc coi mỗi điểm đường thành một token 192 chiều rồi đưa qua Transformer. Vì sao dùng Transformer chứ không phải CNN/MLP đơn giản?","cat":"p3","slide":"14","ord":26,"keys":"kien truc transformer token 192 cls invariant block mha 6 block 2.11M params","a":"Kiến trúc theo các bước:<br>• Mỗi điểm đường thành token qua Linear 7 to 192 + LN + GELU<br>• ghép token [CLS]<br>• qua InvariantBlock x6 (MHA 8 heads + FFN 512 + LayerNorm)<br>• pool [CLS] ra 1 logit xác suất FAIL<br>Transformer hợp vì failure phụ thuộc TƯƠNG TÁC giữa các đoạn ở xa nhau trên đường (ví dụ vào cua gấp ngay sau đoạn tốc độ cao), thứ mà attention nắm bắt tự nhiên còn CNN chỉ thấy cục bộ. Quan trọng hơn, attention cho phép nhét relative-arclength bias để giữ bất biến, điều MLP/CNN thường không có chỗ gắn. Mạng chỉ 2.11M params (~2.5x RoadFury) nhưng vẫn nhẹ, train 24 phút."},{"q":"Positional encoding tuyệt đối sin/cos theo index i phá vỡ bất biến như thế nào, và relative-arclength RFF bias sửa ra sao?","cat":"p3","slide":"15","ord":27,"keys":"positional encoding tuyet doi index relative arclength rff bias delta s fourier vo bat bien hoi dong giao su cau kho rat kho","a":"PE tuyệt đối mã hóa VỊ TRÍ token thứ i, nên khi xoay hoặc cắt đường thì cùng một index lại ứng với arclength khác, model bị khóa vào vị trí tuyệt đối và bất biến vỡ. Giải pháp là bỏ PE tuyệt đối, thay bằng bias cộng vào ma trận attention chỉ phụ thuộc HIỆU arclength Δs_ij=s_i−s_j: bias_ij=MLP(sin(Δs_ij·ω)) với ω là 32 tần số Fourier ngẫu nhiên (RFF) CỐ ĐỊNH. Vì bias chỉ nhìn hiệu số, không bao giờ nhìn i hay j riêng lẻ, nó bất biến với đổi gốc tham số hóa. Đây là mảnh ghép giúp bất biến sống sót qua từng lớp attention, không chỉ ở đầu vào."},{"q":"Δs attention bias là điểm tốn compute nhất. Chi phí O(B·L²·32) đến từ đâu, và có đáng không?","cat":"p3","slide":"15","ord":28,"keys":"chi phi cost O B L2 32 attention bias ton nhat 24 phut train rff rope tuong lai","a":"Mỗi block phải tính bias cho MỌI cặp token (i,j), tức L² cặp, mỗi cặp qua RFF 32 tần số, nhân với batch B thành O(B·L²·32), và làm lại ở cả 6 block nên đây là phần đắt nhất, đẩy thời gian train lên 24 phút. Đáng, vì đây chính là cơ chế giữ bất biến trong attention, thứ mang lại ΔAPFD=0.0000; bỏ nó đi thì mất luôn tính chất cốt lõi. Hướng tối ưu tương lai là RoPE-1D trên s_norm, nhúng thông tin arclength tương đối trực tiếp vào query/key nên khỏi dựng ma trận bias L², rẻ hơn mà vẫn bất biến."},{"q":"Vì sao dùng Focal Loss chứ không phải BCE thuần? Cơ chế (1−p̂_t)^γ giải quyết vấn đề gì?","cat":"p3","slide":"16","ord":29,"keys":"focal loss bce imbalance mat can bang fail 30 40 percent gamma down weight ca de","a":"FAIL chỉ chiếm ~30-40% dữ liệu, nên BCE thuần bị lệ thuộc vào lớp PASS đông và có xu hướng đoán PASS hết để tối thiểu loss, làm hỏng việc phát hiện ca fail (đúng cái ta cần). Focal thêm hệ số (1−p̂_t)^γ để down-weight những ca model đã dự đúng dễ dàng và up-weight những ca khó, kéo gradient tập trung vào biên quyết định thay vì vào đám dễ. Nhờ vậy model không bị lớp đa số nuốt chửng. Kết hợp thêm WeightedRandom sampler để cân lại phân phối trong từng batch."},{"q":"Sweep γ∈[1,5] cho APFD gần phẳng rồi chọn γ=1.0. Đây là điểm mạnh hay điểm yếu, và phản biện thế nào?","cat":"p3","slide":"16","ord":30,"keys":"gamma sweep 1 5 phang robust apfd 0.8095 0.0121 chon 1.0 hyperparameter","a":"APFD gần như phẳng qua γ∈[1,5] (đều trong ±σ) là điểm MẠNH: nó cho thấy kết quả robust với siêu tham số γ, không phải nhờ tinh chỉnh may mắn một giá trị đặc biệt. Ta chọn γ=1.0 vì nó đơn giản nhất mà vẫn cho APFD 0.8095±0.0121, theo nguyên tắc chọn cấu hình gọn khi hiệu năng tương đương. Nếu thầy vặn 'vậy Focal có thực sự cần không', ta trả lời phần lợi chính đến từ việc thoát bẫy đoán-PASS-hết của BCE (γ>0 bất kỳ), còn giá trị γ cụ thể thì không nhạy, đó là kết luận trung thực từ sweep chứ không giấu."},{"q":"Số hạng +1/(2n) trong công thức APFD để làm gì, và vì sao random ~0.5 chứ không phải 0?","cat":"p4","slide":"17","ord":31,"keys":"apfd cong thuc formula correction term random 0.5 thang do metric","a":"APFD(π)=1−(ΣTFᵢ)/(n·m)+1/(2n). Phần chính ΣTFᵢ/(n·m) đo vị trí trung bình mà các fault đầu tiên bị lộ; số hạng <b>1/(2n)</b> là hiệu chỉnh biên (correction) cho việc test rời rạc, bù nửa bậc để công thức không thiên vị theo n. Một thứ tự ngẫu nhiên lộ lỗi rải đều nên kỳ vọng rơi vào giữa dãy, cho APFD <b>≈0.5</b>; thứ tự lý tưởng dồn mọi fail lên đầu cho APFD tiến tới <b>1.0</b>. Vì thế thang [0,1] và mốc 0.5 là baseline mù, mọi method phải vượt rõ mốc này mới có nghĩa."},{"q":"Vì sao cần tới 3 lớp giao thức đánh giá, mỗi lớp phòng thủ điều gì?","cat":"p4","slide":"17","ord":32,"keys":"3 lop giao thuc protocol single pass multi trial rotation probe phong thu","a":"Ba lớp trả lời ba câu phản biện khác nhau.<br>• <b>Single-pass</b> (xếp 1 lần trên 956 test, APFD=<b>0.8047</b>) là điểm chính nhưng dễ bị nghi 'may nhờ một thứ tự cố định'.<br>• <b>Multi-trial</b> 30 lần, mỗi trial lấy ngẫu nhiên 287/956 test, cho <b>0.8048±0.0118</b>, chứng minh điểm ổn định chứ không do một cấu hình test cụ thể.<br>• <b>Rotation probe</b> xoay toàn bộ split rồi đánh giá lại để kiểm chứng bất biến hình học.<br>Tách 3 lớp để mỗi con số bịt đúng một lỗ hổng, không gộp thành một điểm chung chung."},{"q":"Multi-trial lấy ngẫu nhiên 287/956 test mỗi lần để làm gì, tại sao không dùng cả 956?","cat":"p4","slide":"17","ord":33,"keys":"multi trial subsample 287 956 do on dinh std variance may rui","a":"Cả 956 test đã cho ở single-pass rồi, nên lặp lại nó 30 lần không thêm thông tin. Multi-trial <b>subsample 287/956</b> mỗi trial để tạo ra 30 bối cảnh test khác nhau, đo xem APFD có nhạy với việc chọn tập test hay không. Kết quả <b>0.8048±0.0118</b> với std nhỏ cho thấy thứ hạng do model tạo ra ổn định qua các tập con, loại giả thuyết 'điểm cao là may rủi do một thứ tự test cố định'. Đây là kiểm định robustness của metric, không phải để tăng điểm."},{"q":"Vì sao Δ=0 tuyệt đối chứ không phải ~10⁻³, và tại sao điều đó mạnh hơn 'trong sai số'?","cat":"p4","slide":"18","ord":34,"keys":"delta 0 pixel identical bat bien invariance se2 float bit sai so hoi dong giao su cau kho rat kho","a":"Pipeline 7 kênh của SE2RoadNet được thiết kế bất biến SE(2): sau khi xoay đường, biểu diễn trả về vector <b>pixel-identical</b>, nên logit y giữ nguyên và mọi góc cho đúng <b>0.8047</b>. Khác biệt là <b>0.0000</b> đến từng bit float, không phải 10⁻³. 'Trong sai số' chỉ là lập luận thống kê yếu, còn Δ=0 tuyệt đối nghĩa là bất biến được xác minh bằng thực nghiệm đúng như lý thuyết, không cần chữ 'xấp xỉ'. Đây là bằng chứng cơ học, phản bác được nghi ngờ 'chỉ là trùng hợp trong noise'."},{"q":"Vì sao baseline ITS4SDC lại TRÔI điểm khi xoay đường, còn ta thì không?","cat":"p4","slide":"18","ord":35,"keys":"its4sdc troi diem drift baseline goc angle delta 0.057 he toa do hoi dong giao su cau kho kho","a":"ITS4SDC học đặc trưng phụ thuộc hệ tọa độ tuyệt đối (hướng, vị trí thô của đường), nên khi xoay input thì feature đổi, xếp hạng đổi và APFD dao động: 0° <b>0.7810</b>, +30° 0.7240, +60° 0.7518, +90° 0.7396, +180° 0.7334, −45° 0.7627, cho Δ=<b>0.0570</b>. SE2RoadNet đưa tính bất biến SE(2) vào ngay trong biểu diễn nên xoay không đổi vector, Δ=<b>0.0000</b>. Δ chính là thước đo rò rỉ hình học: baseline có 5.7 điểm phần trăm biến động chỉ vì một phép quay vốn không đổi ngữ nghĩa test."},{"q":"Nếu thầy nói 'APFD của các em chỉ NGANG baseline tốt nhất, cải thiện ở đâu?' thì phản biện thế nào?","cat":"p4","slide":"19","ord":36,"keys":"leaderboard pareto ngang baseline auc 0.934 robustness phan bien duy nhat","a":"Đây là cải thiện theo nghĩa <b>Pareto</b>, không đánh đổi. SE2RoadNet giữ APFD đỉnh (<b>0.805</b>, ngang RoadFury 0.804) nhưng đồng thời tăng AUC từ 0.917 lên <b>0.934</b> (+0.017) và là phương pháp <b>DUY NHẤT</b> có bảo chứng Δ=0 bất biến SE(2). Không method nào trên leaderboard đạt cả ba: Random 0.493, SO-SDC GA 0.765, ITS4SDC 0.781, Greedy-diversity 0.795. Nói cách khác ta không mua APFD bằng cách hy sinh thứ khác, mà thêm hai bảo đảm (AUC cao hơn + robustness tuyệt đối) trên cùng mức APFD tốt nhất."},{"q":"AUC và APFD khác nhau ở chỗ nào, vì sao KHÔNG được gộp thành một điểm 'tốt hơn'?","cat":"p4","slide":"20","ord":37,"keys":"auc apfd khac nhau phan ky divergence pass fail thu hang gop metric","a":"<b>AUC</b> đo khả năng phân loại PASS/FAIL trên từng cặp test, không quan tâm thứ hạng tuyệt đối. <b>APFD</b> đo tốc độ lộ lỗi theo đúng thứ tự chạy, và đây mới là thứ Competition tối ưu. Hai metric gần như luôn phân kỳ: tăng AUC không đảm bảo tăng APFD vì một classifier tách cặp tốt vẫn có thể xếp sai vài fail lên cuối. Gộp chúng thành một điểm sẽ che mất metric nào đang thực sự được tối ưu, nên phải báo cáo riêng và nói rõ metric nào cho tình huống nào."},{"q":"AUC tăng 0.917→0.934 nhưng APFD gần như giữ nguyên ~0.805 nghĩa là gì?","cat":"p4","slide":"20","ord":38,"keys":"auc tang apfd giu tran ceiling phan ky bien an toan honest","a":"Nó xác nhận đúng hiện tượng phân kỳ AUC vs APFD. Model phân loại PASS/FAIL tốt hơn (AUC +0.017) nhưng vì APFD đã ở gần trần trên tập này nên phần cải thiện phân loại không dịch thành thứ tự lộ lỗi nhanh hơn. Trung thực mà nói, đây không phải APFD tăng vọt; giá trị của việc AUC tăng là biên an toàn khi phân bố lỗi đổi, và ta vẫn giữ APFD đỉnh. Bài học: không được suy 'AUC tăng nên prioritization chắc chắn tốt hơn', phải kiểm bằng chính APFD."},{"q":"Rotation probe xoay những góc {0,30,60,90,180,−45}° có ý nghĩa gì, chọn góc vậy để làm gì?","cat":"p4","slide":"18","ord":39,"keys":"rotation probe goc angle 30 60 90 180 -45 delta max min bat bien hoi dong giao su cau kho kho","a":"Tập góc phủ ba loại để chắc chắn bất biến không phải trùng hợp ở vài phép quay đẹp:<br>• góc vuông (0/90/180 kiểm dạng đối xứng lưới)<br>• góc lệch không tầm thường (30/60)<br>• góc âm (−45)<br>Ta xoay TOÀN BỘ split rồi đánh giá lại, lấy Δ=max−min APFD. Với SE2RoadNet mọi góc đều <b>0.8047</b> nên Δ=<b>0.0000</b>; với ITS4SDC Δ=<b>0.0570</b>. Chọn nhiều loại góc để phép kiểm chứng bất biến có sức nặng thực nghiệm, không thể bị phản bác là 'may ở góc dễ'."},{"q":"Vì sao AUC và APFD phân kỳ, và điều đó nói lên hạn chế gì của cách đánh giá?","cat":"p5","slide":"21","ord":40,"keys":"auc apfd phan ky divergence metric ranking prioritization","a":"Vì <b>AUC</b> đo chất lượng phân loại tổng thể (xác suất xếp một case fail trên một case pass), còn <b>APFD</b> chỉ thưởng cho việc dồn fail lên <b>đầu prefix</b>. Một mô hình có thể cải thiện AUC bằng cách sắp đúng vùng đuôi mà không kéo được fail lên top, nên AUC cao <b>không</b> kéo theo APFD cao. Hạn chế là không thể báo một con số duy nhất: phải lập luận metric nào quan trọng theo ngữ cảnh (APFD khi ngân sách chạy test bị cắt sớm, AUC khi cần ranking toàn cục). Deck thừa nhận thẳng điều này thay vì chọn metric có lợi."},{"q":"Listwise loss được kỳ vọng cải thiện ranking, tại sao lại đưa vào phần hạn chế?","cat":"p5","slide":"21","ord":41,"keys":"listwise loss apfd sigma variance on dinh stability headline","a":"Vì thực nghiệm cho thấy listwise loss <b>không tăng APFD trung bình</b>, nó chỉ <b>giảm σ</b> (độ lệch chuẩn giữa các lần chạy). Nghĩa là đóng góp thực sự là <b>tính ổn định</b>, không phải nâng trần hiệu năng. Deck trung thực xếp nó là contribution phụ về robustness chứ không thổi thành headline. Cách phản biện đúng: đừng bán listwise như một cú nhảy accuracy, mà nói nó làm kết quả ít phụ thuộc seed hơn, điều này vẫn có giá trị vận hành khi triển khai."},{"q":"Trên benchmark có tỉ lệ FAIL rất cao, APFD chỉ đạt ~0.52 có phải là thất bại của mô hình không?","cat":"p5","slide":"21","ord":42,"keys":"apfd ceiling tran fail rate 0.52 0.95 upper bound benchmark","a":"Không, đó là <b>trần lý thuyết (ceiling)</b> chứ không phải mô hình dở. Khi ~95% test đã là FAIL thì thứ tự nào cũng đẩy fail lên sớm, dư địa để một ranker tạo khác biệt gần như bằng 0, nên APFD bị kẹp quanh <b>~0.52</b>. Đây là đặc tính của metric trên phân phối lệch, không phải tín hiệu về chất lượng phương pháp. Cách phản biện: khi thầy chỉ vào con số thấp, chỉ ra fail-rate của bench đó và so với trần, không so tuyệt đối giữa các bench có phân phối khác nhau."},{"q":"Cơ chế đảm bảo an toàn Conformal hiện ở trạng thái nào và vì sao chưa ship?","cat":"p5","slide":"21","ord":43,"keys":"conformal an toan safety v1 v2 v3 valid vacuous informative prefix apfd","a":"Conformal đang dở giữa hai phiên bản: <b>v1 valid nhưng vô nghĩa</b> (bound đúng về mặt thống kê nhưng lỏng tới mức vacuous, không nói được gì hữu ích), còn <b>v2 informative nhưng invalid</b> (bound chặt nhưng vi phạm coverage). Chưa có phiên bản vừa valid vừa non-vacuous nên chưa ship, cần <b>v3</b>. Deck báo cáo trung thực trạng thái này thay vì trưng một bound đẹp mà sai. Hướng v3: chặn dưới prefix-APFD vừa valid vừa non-vacuous, kèm audit tỉ lệ vi phạm."},{"q":"Vì sao dịch phân phối SensoDat sang Competition được liệt kê là 'negative đã biết'?","cat":"p5","slide":"21","ord":44,"keys":"dich phan phoi distribution shift irm tent sensodat competition gap negative domain","a":"Vì đã thử <b>IRM</b> và <b>TENT</b> để thu hẹp gap domain giữa SensoDat và Competition nhưng <b>chưa đóng được gap</b>, đây là một <b>negative result đã biết</b> chứ không phải chưa kiểm tra. Deck giữ nó trong phần hạn chế thay vì giấu, đúng tinh thần honest negative. Bất biến hình học giúp giảm một phần shift nhưng shift còn lại đến từ phân phối kịch bản/đường đi khác nhau, không phải phép biến đổi tọa độ. Hướng đi là SSL physics-informed để học biểu diễn nền chuyển được, thay vì ép align bằng IRM/TENT."},{"q":"Bất biến xoay được nói là 'exact', còn bất biến lấy mẫu chỉ 'xấp xỉ'. Khác biệt bản chất là gì và bằng chứng nào?","cat":"p5","slide":"21","ord":45,"keys":"bat bien xoay rotation exact sampling resolution probe delta 0.0012 rff rope invariance approximate hoi dong giao su cau kho kho","a":"<b>Bất biến xoay là exact</b>: nó đến từ tính chất đối xứng của kiến trúc/biểu diễn nên xoay đầu vào không đổi đầu ra theo đúng nghĩa đại số, sai số về 0 (chỉ còn nhiễu số học). <b>Bất biến lấy mẫu (resolution) chỉ là xấp xỉ</b>: đổi mật độ lấy mẫu vẫn làm output nhích nhẹ, resolution probe đo được <b>Δ~0.0012</b>, rất nhỏ nhưng khác 0 nên chưa exact. Bằng chứng chính là chênh lệch giữa hai probe: xoay cho Δ ở mức nhiễu máy, còn resolution cho Δ hữu hạn. Cách phản biện khi thầy vặn 'sao dám gọi bất biến': phân biệt rõ đảm bảo exact (xoay) với đảm bảo đang hoàn thiện (resolution), và nêu hướng RoPE-1D trên s_norm để đẩy resolution-Δ tiến về 0."},{"q":"Bốn hướng phát triển giải quyết đúng bốn hạn chế nào, theo kiểu một-đối-một?","cat":"p5","slide":"22","ord":46,"keys":"huong phat trien future work multi benchmark conformal v3 rope ssl physics informed roadmap","a":"Bốn hướng ánh xạ trực tiếp vào bốn điểm yếu:<br>• <b>Tổng quát hóa đa benchmark</b> (một công thức, 8+ bench công khai, APFD không tinh chỉnh theo bench) trả lời rủi ro overfit metric và phân kỳ AUC/APFD.<br>• <b>Conformal v3</b> (chặn dưới prefix-APFD vừa valid vừa non-vacuous, audit vi phạm độ cong) đóng cái dở của v1/v2.<br>• <b>RoPE-1D trên s_norm</b> thay RFF bias để đưa bất biến lấy mẫu về <b>exact</b> (resolution-Δ→0), rẻ hơn.<br>• <b>SSL physics-informed</b> gắn độ cong/jerk làm pretext, thay SSL hình học ngây thơ chuyển kém, để đóng gap phân phối.<br>Mục tiêu chung: từ một baseline bất biến cho SDC lên công thức chung bất biến và audit-readable cho mọi benchmark."},{"q":"APFD chênh 4 lần (0.80 vs 0.20) dù cùng tập lỗi. Thầy bắt tính tay: con số này ở đâu ra và nó CHỨNG MINH điều gì về metric?","cat":"math","slide":"B1","ord":47,"keys":"apfd vi du tay thu tu order fault rank cong thuc","a":"APFD = 1 − (Σ vị trí FAIL)/(n·m) + 1/(2m), với n=5 test, m=2 lỗi. Xếp TỐT (FAIL ở 1,2): 1 − 3/10 + 1/10 = <b>0.80</b>. Xếp KÉM (FAIL ở 4,5): 1 − 9/10 + 1/10 = <b>0.20</b>. Cùng đúng 2 lỗi đó, chỉ khác THỨ TỰ mà APFD chênh 4 lần. Điểm mấu chốt: APFD không đo 'phát hiện được bao nhiêu lỗi' mà đo 'phát hiện SỚM cỡ nào', nên nó là metric đánh giá RANKING chứ không phải khả năng phát hiện. Đây chính là lý do bài toán đáng làm."},{"q":"Vì sao phải chạy 30 trials mà không lấy 1 con số APFD cho gọn? Thầy hỏi 30 có ý nghĩa thống kê gì.","cat":"math","slide":"B2","ord":49,"keys":"multi trial 30 lan seed variance sigma on dinh single pass","a":"APFD single-pass gắn với MỘT thứ tự cố định nên rất nhạy: một con số dễ may rủi theo cách xáo test. Mỗi trial rút ngẫu nhiên max(50, 0.3·|test|)=<b>287/956</b> test, tính APFD độc lập, lặp 30 lần với seed=42 để tái lập. Ta báo cáo <b>0.8048±0.0118</b>. Với reviewer, σ=0.0118 thường QUAN TRỌNG hơn mean: nó nói ranking ổn định qua các tập con, không phải ăn may một lần. Một mean cao mà σ lớn thì kém tin cậy hơn mean thấp hơn chút mà σ nhỏ."},{"q":"Resolution probe cho Δ~0.0012, không phải 0. Thầy vặn: vậy mô hình CÓ bất biến lấy mẫu hay không?","cat":"math","slide":"B3","ord":50,"keys":"resolution probe bat bien lay mau resample N delta gan bat bien rope","a":"Thành thật: đây là bất biến GẦN, không tuyệt đối. Ta lấy cùng một đường, resample ở N∈{64..197} điểm rồi chấm lại; Δ=max−min APFD qua các mức N chỉ ~<b>0.0012</b>, rất nhỏ nhưng KHÁC 0. So với phép xoay đạt Δ=0 exact (bất biến bằng kiến trúc), thì bất biến theo mật độ lấy mẫu chưa exact. Nguyên nhân: bias RFF phụ thuộc Δs là gần-bất-biến tại tham số hóa chứ không tuyệt đối. Mitigation đã nêu trong deck: hướng RoPE-1D để đưa bất biến tham số hóa thành exact-by-construction giống như xoay."},{"q":"Nếu scorer chạy vài giây/tập thì 'tiết kiệm nhiều giờ' đến từ đâu? Thầy nghi ngờ con số lợi ích.","cat":"math","slide":"B4","ord":51,"keys":"chi phi quy mo scorer inference mo phong vat ly simulation cpu tiet kiem","a":"Chi phí THẬT không nằm ở scorer. Inference là 1 forward pass/đường, batch (n,7,197) chấm cả tập trong vài giây GPU, và train chỉ một lần 24.2 phút với 2.11M params. Tiền bạc thực sự tiêu ở MÔ PHỎNG VẬT LÝ của những test được chọn chạy. Ranking tốt dồn lỗi lên đầu, nên chạy ít kịch bản đầu đã lộ phần lớn lỗi và cho phép dừng sớm, cắt hàng giờ CPU mô phỏng. Đúng tinh thần 'the best simulation is the one you never run': giá trị là tránh chạy sim vô ích, không phải tăng tốc scorer."},{"q":"Chứng minh 7 kênh bất biến SE(2): thầy bắt chỉ ra CHÍNH XÁC vì sao mỗi đại lượng không đổi khi xoay+tịnh tiến.","cat":"math","slide":"B5","ord":52,"keys":"se2 chung minh bat bien 7 kenh delta s theta kappa dao ham hoi dong giao su cau kho kho","a":"SE(2) biến p→R·p+t. Các kênh đều bất biến:<br>• Δs=||p_{i+1}−p_i|| bất biến vì R trực giao bảo toàn khoảng cách và t triệt tiêu khi trừ hai điểm.<br>• |Δθ| bất biến vì R bảo toàn góc giữa các vector.<br>• κ=Δθ/Δs và các đạo hàm theo s là HÀM của các đại lượng đã bất biến nên cũng bất biến.<br>Điều kiện CẦN: loại bỏ sinθ, cosθ, θ vì chúng phụ thuộc trực tiếp vào R (góc tuyệt đối đổi khi xoay). Đã loại hết các kênh phụ thuộc hướng tuyệt đối thì 7 kênh còn lại đều là bất biến vi phân."},{"q":"Thầy hỏi: bất biến này là do KIẾN TRÚC hay do data augmentation? Khác nhau chỗ nào mà quan trọng?","cat":"math","slide":"B5","ord":53,"keys":"bat bien kien truc architecture augmentation dam bao xay dung linear attention pool hoi dong giao su cau kho kho","a":"Do KIẾN TRÚC, đảm bảo bằng xây dựng. Vì đầu vào của mọi tầng sau (Linear, attention bias theo Δs, pool) đều đã là đại lượng bất biến, và các phép này giữ nguyên tính bất biến, nên output bất biến với MỌI input, không cần huấn luyện. Khác với augmentation: augmentation chỉ 'dạy' mô hình gần bất biến trên phân phối data thấy được, có thể vỡ ở góc xoay lạ. Bất biến bằng kiến trúc cho Δ=0 exact, không phụ thuộc data hay seed. Đây là lý do phép xoay đạt exact còn bất biến lấy mẫu (B3) thì chưa."},{"q":"Menger κ dùng đường tròn ngoại tiếp cho |κ|, nhưng model lại dùng Δθ/Δs. Vì sao bỏ công thức Menger 'chuẩn' đi?","cat":"math","slide":"appendix-menger","ord":54,"keys":"menger kappa duong tron ngoai tiep heron dau chieu cua signed delta theta","a":"Menger cho 3 điểm dựng đường tròn ngoại tiếp bán kính R: s=(a+b+c)/2, Area theo Heron, κ=1/R=4·Area/(a·b·c). Nhưng nó cho |κ| KHÔNG DẤU, mất thông tin chiều cua. SE2RoadNet dùng k=Δθ/Δs (sai phân góc GIỮ DẤU) để giữ được cua trái (+) và cua phải (−), thứ mà một road-net cần phân biệt. Cả hai đều bất biến SE(2), nhưng Δθ/Δs mang thêm dấu nên giàu thông tin hơn cho bài toán này. Bỏ Menger không phải vì nó sai, mà vì |·| vứt mất dấu."},{"q":"Attention bias dùng φ=sin(Δs·ω). Thầy hỏi tại sao chọn sin, và hệ quả 'bias bất đối xứng' nghĩa là gì?","cat":"math","slide":"appendix-attn","ord":55,"keys":"attention bias sin rff phi omega bat doi xung truoc sau asymmetric","a":"Δs_ij=s_i−s_j, φ=sin(Δs·ω) với 32 tần số ω~N(0,2²), rồi MLP 32→64→8 cho bias_ij∈R⁸, cộng vào score_ij=(q_i·k_j)/√d + bias_ij trước softmax. Chọn sin vì nó LẺ: Δs_ji=−Δs_ij kéo theo sin đổi dấu, nên bias trước→sau khác bias sau→trước. Đó là 'bất đối xứng': model phân biệt được điểm nằm TRƯỚC hay SAU trên cung, điều một hàm chẵn (như cos) không làm được. Đây là cách nhét thông tin chiều dọc theo cung vào attention mà vẫn giữ bất biến."},{"q":"Vì sao dời gốc cung s→s+c thì output không đổi? Thầy bắt chứng minh bất biến tham số hóa qua softmax.","cat":"math","slide":"appendix-attn","ord":56,"keys":"doi goc cung s+c bat bien tham so hoa reparam softmax delta s giu nguyen hoi dong giao su cau kho thuong","a":"Attention chỉ phụ thuộc HIỆU Δs_ij=s_i−s_j, không phụ thuộc gốc s. Khi dời gốc s→s+c thì Δs_ij=(s_i+c)−(s_j+c) giữ nguyên, nên mọi φ, mọi bias_ij, mọi score_ij giữ nguyên, và softmax cũng giữ nguyên. Do đó output bất biến với việc chọn gốc tham số hóa cung. Đây là bảo chứng exact-by-construction (giống xoay), khác với bất biến theo mật độ lấy mẫu ở B3 vốn chỉ gần-exact."},{"q":"Thầy vặn: đưa Δs vào cả node feature (Δs kênh) LẪN attention bias có bị trùng lặp/dư thừa không?","cat":"math","slide":"appendix-attn","ord":57,"keys":"delta s node feature attention bias trung lap redundant local global","a":"Không dư, hai chỗ mang vai trò khác nhau. Δs ở kênh node là đặc trưng CỤC BỘ của từng đoạn (độ dài bước tại điểm i). Δs_ij trong attention là quan hệ TƯƠNG ĐỐI giữa cặp điểm i,j dọc cung, cho phép model biết chúng cách nhau bao xa và trước/sau nhau (nhờ sin lẻ). Một cái mô tả 'điểm này', cái kia mô tả 'điểm này so với điểm kia'. Cả hai đều là đại lượng bất biến SE(2) nên không phá tính bất biến, và chúng bổ sung chứ không chồng lấn thông tin."}];

g equivariant layers augment tăng cường dữ liệu huấn luyện training generalization tổng quát hóa hard-coded symmetry đối xứng baked-in robustness structure","curvature độ cong circumscribed circle three-point discrete rời rạc differential vi phân turning angle góc quay arc length chiều dài cung derivative đạo hàm numerical stability ổn định số học nhiễu noise formula khả vi smoothness trơn tru estimation ước lượng geometry hình học signed có dấu","positional encoding mã hóa vị trí sinusoidal hàm điều hòa asymmetric thiên lệch relative position tương đối attention weights trọng số self-attention frequency tần số phase pha periodicity tuần hoàn directional có hướng transformer distance khoảng cách sign dấu antisymmetric phản đối xứng kernel","reparameterization invariance dịch shift translation offset gốc tọa độ origin starting point điểm bắt đầu normalization chuẩn hóa attention permutation hoán vị proof derivation suy diễn constant hằng equivariance invariant curve đường cong parameterization relative tương đối arc-length","redundancy dư thừa duplication trùng lặp overlap chồng lấp information thông tin node embedding nhúng nút edge cạnh positional encoding vị trí ablation loại bỏ complementary bổ sung double encoding mã hóa kép necessity cần thiết representation biểu diễn spacing khoảng cách interaction tương tác"];
const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'')
                    .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const plain = html => html.replace(/<[^>]+>/g,' ');
const STOP = new Set('slide trang la gi thi co khong nao cua va sao vi o dau mot cai nhe the nhu den cho khi bao nhieu con duoc hay ma di nay kia ra se cung cac nhung to em minh ban ai qua rat hon nua chi voi tren duoi trong ngoai boi tai vay oi nhi deu khac giua tu theo hoac neu con xin chao thay cam on nghe hom troi dep lang da gio bay hi hello oke okay um uh a u anh chi thua kinh'.split(' '));

const words = s => new Set(s.split(/\s+/).filter(x => x.length > 1));

DB.forEach((e, i) => {
  e.sq = strip(e.q);
  e.sk = strip(e.keys || '');
  e.se = strip(EXP[i] || '');
  e.sa = strip(plain(e.a) + ' ' + (e.codeblock || ''));
  e.st = strip(e.slide).split(/[^a-z0-9.]+/).filter(Boolean);
  e.wq = words(e.sq); e.wk = words(e.sk); e.we = words(e.se); e.wa = words(e.sa);
});

let activeCat = 'all';

function within1(a, b){
  if(a === b) return true;
  const la = a.length, lb = b.length;
  if(Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while(i < la && j < lb){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++edits > 1) return false;
    if(la > lb) i++; else if(lb > la) j++; else { i++; j++; }
  }
  if((la - i) + (lb - j) > 0) edits++;
  return edits <= 1;
}

function fieldHit(t, wordSet, str, allowSub){
  if(wordSet.has(t)) return 1;                              // khớp từ nguyên
  if(allowSub && t.length >= 5 && str.includes(t)) return 1; // substring chỉ cho token dài
  if(t.length >= 4){ for(const w of wordSet){ if(w.length >= 4 && within1(t, w)) return 0.6; } } // sai 1 ký tự
  return 0;
}

function scoreEntry(e, toks){
  const use = toks.filter(t => !STOP.has(t));
  if(!use.length) return 0;   // query toàn stopword (lời chào...) -> không match
  let sc = 0, strong = 0;
  for(const t of use){
    if(e.st.some(x => x === t || x.split(/[,\/\s-]/).includes(t))){ sc += 9; strong++; continue; }
    const hq = fieldHit(t, e.wq, e.sq, true) * 5;
    const he = fieldHit(t, e.we, e.se, true) * 4;
    const hk = fieldHit(t, e.wk, e.sk, true) * 3;
    const ha = fieldHit(t, e.wa, e.sa, false) * 1;  // answer: chỉ từ nguyên, không tính là hit mạnh
    const best = Math.max(hq, he, hk, ha);
    if(best > 0){
      sc += best;
      if(Math.max(hq, he, hk) >= 2.4) strong++;
    }
  }
  // phải có ≥1 hit mạnh (câu hỏi / synonym / keys / số slide) mới hiện
  if(strong === 0) return 0;
  return sc;
}

function hl(text, toks){
  let out = '', i = 0;
  const st = strip(text);
  const spans = [];
  for(const t of toks){
    if(STOP.has(t)) continue;
    let from = 0, idx;
    while((idx = st.indexOf(t, from)) !== -1){ spans.push([idx, idx+t.length]); from = idx+1; }
  }
  spans.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const s of spans){
    if(merged.length && s[0] <= merged[merged.length-1][1]) merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], s[1]);
    else merged.push([...s]);
  }
  for(const [a,b] of merged){ out += esc(text.slice(i,a)) + '<mark>' + esc(text.slice(a,b)) + '</mark>'; i = b; }
  return out + esc(text.slice(i));
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function card(e, toks, top){
  return `<div class="card${top ? ' top' : ''}">
    <div class="qline">
      <span class="badge slide">Slide ${esc(e.slide)}</span>
      <span class="qtext">${toks ? hl(e.q, toks) : esc(e.q)}</span>
      <span class="badge">${CATS[e.cat]}</span>
    </div>
    <div class="ans">${e.a}</div>
    ${e.codeblock ? '<pre>'+esc(e.codeblock)+'</pre>' : ''}
  </div>`;
}

function browseItem(e){
  return `<details>
    <summary><span class="badge slide">S${esc(e.slide)}</span> ${esc(e.q)}</summary>
    <div class="ans">${e.a}</div>
    ${e.codeblock ? '<pre>'+esc(e.codeblock)+'</pre>' : ''}
  </details>`;
}

function render(){
  const raw = document.getElementById('q').value.trim();
  const out = document.getElementById('out');
  const pool = activeCat === 'all' ? DB : DB.filter(e => e.cat === activeCat);

  if(!raw){
    let html = '';
    const cats = activeCat === 'all' ? Object.keys(CATS) : [activeCat];
    for(const c of cats){
      const items = DB.filter(e => e.cat === c).sort((a,b) => a.ord - b.ord);
      if(!items.length) continue;
      html += `<div class="grp">${CATS[c]} · ${items.length}</div>` + items.map(browseItem).join('');
    }
    out.innerHTML = html;
    return;
  }

  const toks = strip(raw).split(/\s+/).filter(Boolean);
  const hits = pool.map(e => [scoreEntry(e, toks), e])
                   .filter(x => x[0] > 0)
                   .sort((a,b) => b[0] - a[0] || a[1].ord - b[1].ord)
                   .slice(0, 12);
  out.innerHTML = hits.length
    ? hits.map(([_, e], i) => card(e, toks, i === 0)).join('')
    : '<div class="none">Không có kết quả. Thử: số slide (16, 19, b4...) hoặc từ khóa (domino, cegis, upper, ablation, leakage...)</div>';
}

// chips
const chipsEl = document.getElementById('chips');
chipsEl.innerHTML = `<span class="chip on" data-c="all">Tất cả · ${DB.length}</span>` +
  Object.entries(CATS).map(([k,v]) =>
    `<span class="chip" data-c="${k}">${v.split(' (')[0]} · ${DB.filter(e=>e.cat===k).length}</span>`).join('');
chipsEl.addEventListener('click', ev => {
  const c = ev.target.dataset.c; if(!c) return;
  activeCat = c;
  chipsEl.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.c === c));
  render();
});

const qEl = document.getElementById('q');
qEl.addEventListener('input', render);
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){ qEl.value = ''; render(); qEl.focus(); }
  if(ev.key === '/' && document.activeElement !== qEl){ ev.preventDefault(); qEl.focus(); }
});
document.getElementById('themeBtn').addEventListener('click', () =>
  document.body.classList.toggle('dark'));

render();
</script>
