ỏ sót, phải tăng K hoặc duyệt sâu hơn, đổi lại chi phí tổ hợp tăng mạnh. Trong kết quả hiện tại, lỗi còn lại chủ yếu là package/private/system/import error, không nổi bật dạng \"đáp án nằm ngoài top-8\".<br><b>Chốt: top-8 là heuristic có thứ tự + upper-bound động + phao không pin; đủ thực dụng cho benchmark, nhưng không nên nói là bảo đảm toán học không bỏ sót.</b>"},{"q":"Wheel là gì? Top-8 là bỏ hết à? Chỉ lấy wheel hay ưu tiên wheel trước? Wheel giúp nhanh hơn MEMRES à?","cat":"rangbuoc","slide":"17","ord":10,"keys":"wheel la gi sdist source build bien dich pre-built binary cai san top-8 top 8 bo het uu tien wheel truoc chi lay wheel sort wheel-first tang toc nhanh hon memres 335 -44 rescue ablation timeout 3 phut phao fallback","a":"<b>Wheel là gì:</b><br>• Wheel = gói binary dựng sẵn, cài rất nhanh, tránh compile tại chỗ.<br>• Sdist/source = phải build từ nguồn; với scipy/numpy cũ có thể ăn gần hết timeout 180s hoặc fail vì thiếu compiler/system lib.<br><b>Wheel giúp nhanh hơn không:</b> có. Điểm chính của wheel_filter/ranking là giảm khả năng chọn bản phải source-build, nên bớt timeout. Ablation bỏ wheel filter làm rescue tụt <b>−44%</b>.<br><b>Top-8 có bỏ hết bản không wheel không?</b><br>• Câu an toàn: <b>requires_python là filter cứng; wheel là tín hiệu ưu tiên rất mạnh</b>. CandidateGraphBuilder đưa bản có wheel/cài được lên trước, rồi lấy top-8.<br>• Trong code, nếu release có wheel Linux/pure-python hợp lệ thì đánh dấu tốt; nếu chỉ có sdist/source thì vẫn cho vào như fallback, vì pip có thể build được. Nếu có đủ nhiều bản wheel tốt thì bản source-build thường rơi khỏi top-8; nếu không, nó vẫn có thể được thử.<br><b>Đừng nói quá:</b> không nên nói “mọi bản không wheel đều bị cấm tuyệt đối” nếu thầy hỏi code; nói “ưu tiên/giảm source build” là chuẩn hơn.<br><b>Chốt: wheel = cài sẵn nên nhanh; CGAR ưu tiên wheel trong miền top-8 để tránh source-build timeout, nhưng vẫn giữ tư duy fallback.</b>"},{"q":"CGAR khác gì pip-compile / poetry / pip resolver? Chúng cũng resolve conflict mà?","cat":"rangbuoc","slide":"S14","ord":10.15,"keys":"pip-compile pip compile pip-tools poetry lock resolve conflict resolver co san khac gi metadata runtime chay that build docker import cv2 opencv requirements khong biet gi hoc rang buoc acquisition executor bao goi tren giay","a":"<b>pip-compile / poetry / pip resolver là gì:</b><br>• Bạn đưa danh sách gói muốn cài, nó tìm 1 bộ version thỏa metadata (mỗi gói khai báo cần gói con bản nào) rồi khóa lại. Đúng là cũng giải conflict.<br><b>Khác CGAR ở 3 chỗ, dễ hiểu:</b><br>• <b>1. Nguồn dữ liệu.</b> pip-compile chỉ đọc metadata KHAI BÁO trên PyPI. CGAR đọc thêm KẾT QUẢ CHẠY THẬT (build Docker + import). Nhiều lỗi chỉ lộ khi chạy chứ metadata không ghi: hàm bị xóa (imread mất khỏi scipy ≥ 1.3), wheel không build được, API đổi. pip-compile mù mấy cái đó.<br>• <b>2. Bài toán đầu vào khác.</b> pip-compile giả định BẠN ĐÃ BIẾT cần gói gì. Ở đây mình chỉ có 1 đoạn code lạ với vài dòng import: KHÔNG có requirements, KHÔNG biết version nào, thậm chí không chắc tên pip (import cv2 nhưng gói là opencv-python). CGAR phải suy ra hết từ code.<br>• <b>3. Không có ràng buộc cho sẵn.</b> pip-compile cần bạn tự ghi \"numpy &lt; 2\" thì nó mới né. CGAR bắt đầu với 0 ràng buộc, TỰ HỌC ràng buộc từ lỗi build (imread mất → scipy &lt; 1.3). Học ràng buộc, không phải nhận sẵn.<br><b>Quan hệ:</b> pip thật ra là 1 bước con bên trong: Executor gọi pip để cài. CGAR bọc thêm vòng \"chạy thật → đọc lỗi → học ràng buộc → chọn lại\" ở ngoài.<br><b>Chốt: pip-compile giải conflict trên giấy từ metadata + ràng buộc bạn đưa; CGAR không có sẵn gì cả, suy gói từ code và học ràng buộc từ lần chạy thật.</b>"},{"q":"Giải thích Filter & Solver I/O (backup B1)","cat":"rangbuoc","slide":"B1/32","ord":11,"keys":"filter solver io candidategraphbuilder constraintsolver odometer greedy","a":"<b>CandidateGraphBuilder</b>: nhận packages + python_version → GET PyPI JSON → bỏ pre/dev/post release → lọc cứng <code>requires_python</code> theo Python target → kiểm tra artifact Linux/wheel để ưu tiên bản cài nhanh → sort wheel-first, newest-first → top-8/gói.<br><b>ConstraintSolver</b>: nhận graph + store → prune HARD/SOFT/UPPER → thêm fallback cài không pin ở cuối → greedy chọn bản đầu còn khả thi; nếu combo bị loại thì <code>_next_assignment()</code> duyệt kiểu <b>odometer</b>, skip combo đã biết hỏng, ≤50 attempts thuần logic. Output: assignment hoặc None.<br><b>Chốt: Builder dựng miền thật từ PyPI; Solver chỉ ghép trong miền đó và trong các constraint đã học.</b>"},{"q":"Giải thích cấu trúc Session Store (backup B3)","cat":"rangbuoc","slide":"B3/34","ord":12,"keys":"infeasible record ba store combo upper bounds du lieu","a":"3 store: <code>_records</code> {(pkg,ver,py) → Record}, <code>_combo_records</code> {(FrozenSet,py) → sig} (xung đột cặp package), <code>_upper_bounds</code> {(pkg,py) → version}. Flow: log → <code>normalize_error_signature</code> (strip số dòng, 0xADDR, path để lỗi giống nhau match nhau) → <code>classify_error</code> → <code>_API_REMOVED_RE</code> bắt \"cannot import name X\" → <code>add_upper_bound</code> → Analyzer LLM confirm.","codeblock":"@dataclass\nclass InfeasibleRecord:\n    package, version, python_version: str\n    error_type:      ConstraintType  # HARD | SOFT\n    error_signature: str\n    confidence:      float  # 1.0 / 0.8\n    count:           int    # ++ khi tái quan sát\n\n_HARD = [\"requires a different Python\",\n         \"No matching distribution found\"]\n_SOFT = [\"ImportError\", \"ModuleNotFoundError\",\n         \"cannot import name\"]\n_API_REMOVED_RE = r\"cannot import name '(\\w+)' from '...'\""},{"q":"Xử lý 2 package xung đột lẫn nhau (combo)?","cat":"rangbuoc","slide":"B3/34","ord":13,"keys":"combo conflict xung dot cap frozen set exclude","a":"<code>_combo_records</code> lưu (FrozenSet các pinned version, python) → error signature: combo fail bị loại <b>nguyên cụm</b>. Solver truyền <code>exclude_combo</code> vào lần solve sau, odometer skip các combo đã biết hỏng, không chỉ cấm version đơn lẻ."},{"q":"Giải thích session-scoped learning bằng ví dụ cụ thể","cat":"rangbuoc","slide":"20","ord":14,"keys":"session store chia se snippet vi du hoc cheo repo batch","a":"Session = 1 repository/batch nhiều snippet. Store <b>không reset giữa các snippet</b>; chỉ trạng thái per-snippet như current assignment/critic history mới reset.<br><b>Ví dụ:</b> snippet 3 fail với <code>from scipy.misc import imread</code>, Analyzer học <code>scipy &lt; 1.3</code> trên Py3.7. Snippet 17 cùng session cũng dùng imread → solver đọc Store và ưu tiên luôn vùng dưới 1.3, thường chọn <code>scipy==1.2.3</code> ngay từ build đầu thay vì trả lại học phí.<br><b>Điểm cần nói mềm:</b> đây là ví dụ cơ chế, không phải hứa mọi snippet sau đều 0 fail. Nếu còn lỗi numpy/Python/native khác thì vẫn có thể fail tiếp và học tiếp.<br><b>Chốt: snippet trước biến lỗi thành constraint; snippet sau dùng lại constraint đó trong cùng session.</b>"},{"q":"Analyzer học constraint SAI thì sao? Hệ có sập không?","cat":"rangbuoc","slide":"19, B5","ord":16,"keys":"constraint sai hoc nham wrong sap khong an toan","a":"Có rủi ro, nên hệ có nhiều lớp giảm tác hại:<br>• <b>1.</b> SOFT cần ≥2 lần quan sát mới bị coi là cấm mạnh.<br>• <b>2.</b> HARD/SOFT/UPPER có confidence và type rõ, không phải text tự do.<br>• <b>3.</b> Anti-hallucination: type/action/version ngoài schema hoặc ngoài candidate graph thì discard/fallback.<br>• <b>4.</b> UPPER bound có regex/log signal hỗ trợ; LLM không được tự do bịa ràng buộc tùy ý.<br>• <b>5.</b> Solver còn các candidate khác và fallback không pin; nếu ràng buộc làm bí, hệ có thể quay đường MEMRES/cascade hoặc fail có kiểm soát.<br><b>Chốt: học sai có thể làm mất một hướng tìm kiếm, nhưng không làm hệ “sập”; nó bị giới hạn bởi schema, threshold, candidate graph và fallback.</b>"},{"q":"Cải tiến chính của CGAR là gì?","cat":"rangbuoc","slide":"19, 25","ord":17,"keys":"cai tien chinh novelty dong gop cgar typed constraints constraint store upper bound wheel filter agent schema docker feedback prune session sharing","a":"<b>Cải tiến chính:</b> CGAR biến lỗi Docker thành <b>ràng buộc có cấu trúc</b> để lần sau solver né thông minh hơn.<br><br>• <b>Typed constraints:</b> lỗi được ghi thành HARD / SOFT / UPPER, không chỉ lưu text log.<br>• <b>Prune cả vùng version:</b> ví dụ <code>cannot import imread</code> → <code>scipy &lt; 1.3</code>, loại cả vùng version mới hơn thay vì thử từng bản.<br>• <b>Session Store:</b> constraint học từ snippet trước được dùng lại cho snippet sau trong cùng batch.<br>• <b>Agent có vai rõ:</b> Planner chọn version, Analyzer học constraint, Critic xử lý khi kẹt; output đều bị ép schema để dễ kiểm soát.<br><br><b>Chốt miệng:</b> cải tiến của em là chuyển từ retry/memory dạng chữ sang constraint-guided resolution: fail một lần thì học được luật để tỉa không gian tìm kiếm."}];

const plain = html => html.replace(/<[^>]+>/g,' ');
const STOP = new Set('slide trang la gi thi co khong nao cua va sao vi o dau mot cai nhe the nhu den cho khi bao nhieu con duoc hay ma di nay kia ra se cung cac nhung to em minh ban ai qua rat hon nua chi voi tren duoi trong ngoai boi tai vay oi nhi deu khac giua tu theo hoac neu con xin chao thay cam on nghe hom troi dep lang da gio bay hi hello oke okay um uh a u anh chi thua kinh'.split(' '));

DB.forEach((e, i) => {
  e.sq = strip(e.q);
  e.sk = strip(e.keys || '');
  e.se = strip(EXP[i] || '');
  e.sa = strip(plain(e.a) + ' ' + (e.codeblock || ''));
  e.st = strip(e.slide).split(/[^a-z0-9.]+/).filter(Boolean);
  e.wq = words(e.sq); e.wk = words(e.sk); e.we = words(e.se); e.wa = words(e.sa);

let activeCat = 'all';

function within1(a, b){
  if(a === b) return true;
  const la = a.length, lb = b.length;
  if(Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while(i < la && j < lb){
    if(a[i] === b[j]){ i++; j++; continue; }
    if(++edits > 1) return false;
    if(la > lb) i++; else if(lb > la) j++; else { i++; j++; }
  }
  if((la - i) + (lb - j) > 0) edits++;
  return edits <= 1;
}

function fieldHit(t, wordSet, str, allowSub){
  if(wordSet.has(t)) return 1;                              // khớp từ nguyên
  if(allowSub && t.length >= 5 && str.includes(t)) return 1; // substring chỉ cho token dài
  if(t.length >= 4){ for(const w of wordSet){ if(w.length >= 4 && within1(t, w)) return 0.6; } } // sai 1 ký tự
  return 0;
}

function scoreEntry(e, toks){
  const use = toks.filter(t => !STOP.has(t));
  if(!use.length) return 0;   // query toàn stopword (lời chào...) -> không match
  let sc = 0, strong = 0;
  for(const t of use){
    if(e.st.some(x => x === t || x.split(/[,\/\s-]/).includes(t))){ sc += 9; strong++; continue; }
    const hq = fieldHit(t, e.wq, e.sq, true) * 5;
    const he = fieldHit(t, e.we, e.se, true) * 4;
    const hk = fieldHit(t, e.wk, e.sk, true) * 3;
    const ha = fieldHit(t, e.wa, e.sa, false) * 1;  // answer: chỉ từ nguyên, không tính là hit mạnh
    const best = Math.max(hq, he, hk, ha);
    if(best > 0){
      sc += best;
      if(Math.max(hq, he, hk) >= 2.4) strong++;
    }
  }
  // phải có ≥1 hit mạnh (câu hỏi / synonym / keys / số slide) mới hiện
  if(strong === 0) return 0;
  return sc;
}

function hl(text, toks){
  let out = '', i = 0;
  const st = strip(text);
  const spans = [];
  for(const t of toks){
    if(STOP.has(t)) continue;
    let from = 0, idx;
    while((idx = st.indexOf(t, from)) !== -1){ spans.push([idx, idx+t.length]); from = idx+1; }
  }
  spans.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const s of spans){
    if(merged.length && s[0] <= merged[merged.length-1][1]) merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], s[1]);
    else merged.push([...s]);
  }
  for(const [a,b] of merged){ out += esc(text.slice(i,a)) + '<mark>' + esc(text.slice(a,b)) + '</mark>'; i = b; }
  return out + esc(text.slice(i));
}
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function card(e, toks, top){
  return `<div class="card${top ? ' top' : ''}">
    <div class="qline">
      <span class="badge slide">Slide ${esc(e.slide)}</span>
      <span class="qtext">${toks ? hl(e.q, toks) : esc(e.q)}</span>
      <span class="badge">${CATS[e.cat]}</span>
    </div>
    <div class="ans">${e.a}</div>
    ${e.codeblock ? '<pre>'+esc(e.codeblock)+'</pre>' : ''}
  </div>`;
}

function browseItem(e){
  return `<details>
    <summary><span class="badge slide">S${esc(e.slide)}</span> ${esc(e.q)}</summary>
    <div class="ans">${e.a}</div>
    ${e.codeblock ? '<pre>'+esc(e.codeblock)+'</pre>' : ''}
  </details>`;
}

function render(){
  const raw = document.getElementById('q').value.trim();
  const out = document.getElementById('out');
  const pool = activeCat === 'all' ? DB : DB.filter(e => e.cat === activeCat);

  if(!raw){
    let html = '';
    const cats = activeCat === 'all' ? Object.keys(CATS) : [activeCat];
    for(const c of cats){
      const items = DB.filter(e => e.cat === c).sort((a,b) => a.ord - b.ord);
      if(!items.length) continue;
      html += `<div class="grp">${CATS[c]} · ${items.length}</div>` + items.map(browseItem).join('');
    }
    out.innerHTML = html;
    return;
  }

  const toks = strip(raw).split(/\s+/).filter(Boolean);
  const hits = pool.map(e => [scoreEntry(e, toks), e])
                   .filter(x => x[0] > 0)
                   .sort((a,b) => b[0] - a[0] || a[1].ord - b[1].ord)
                   .slice(0, 12);
  out.innerHTML = hits.length
    ? hits.map(([_, e], i) => card(e, toks, i === 0)).join('')
    : '<div class="none">Không có kết quả. Thử: số slide (16, 19, b4...) hoặc từ khóa (domino, cegis, upper, ablation, leakage...)</div>';
}

// chips
const chipsEl = document.getElementById('chips');
chipsEl.innerHTML = `<span class="chip on" data-c="all">Tất cả · ${DB.length}</span>` +
  Object.entries(CATS).map(([k,v]) =>
    `<span class="chip" data-c="${k}">${v.split(' (')[0]} · ${DB.filter(e=>e.cat===k).length}</span>`).join('');
chipsEl.addEventListener('click', ev => {
  const c = ev.target.dataset.c; if(!c) return;
  activeCat = c;
  chipsEl.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.c === c));
  render();
});

const qEl = document.getElementById('q');
qEl.addEventListener('input', render);
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){ qEl.value = ''; render(); qEl.focus(); }
  if(ev.key === '/' && document.activeElement !== qEl){ ev.preventDefault(); qEl.focus(); }
});
document.getElementById('themeBtn').addEventListener('click', () =>
  document.body.classList.toggle('dark'));

render();
</script>
</body>
</html>
