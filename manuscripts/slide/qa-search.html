<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGAR Giải thích theo Slide</title>
<style>
  :root{
    /* light mặc định: nền giấy ấm, dịu mắt */
    --bg:#FAF8F4; --panel:#FFFFFF; --panel2:#F1EDE6; --text:#2B3338; --muted:#6B7A81;
    --accent:#C9640A; --teal:#177A8C; --green:#3E7D31; --red:#B33F33; --border:#E2DCD2;
    --mark:#F7C97F66;
  }
  .dark{
    --bg:#0E1518; --panel:#18242B; --panel2:#1E2E36; --text:#E8ECEE; --muted:#8FA1A8;
    --accent:#EB811B; --teal:#4FB8C9; --green:#7CC46B; --red:#E06C5F; --border:#2A3A42;
    --mark:#EB811B33;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; padding-bottom:80px;}
  header{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--border); padding:14px 18px 10px;}
  .row{display:flex; align-items:center; gap:12px; max-width:1000px; margin:0 auto;}
  h1{font-size:17px; white-space:nowrap;}
  h1 span{color:var(--accent);}
  #q{flex:1; font-size:18px; padding:10px 14px; border-radius:10px; border:1.5px solid var(--border);
     background:var(--panel); color:var(--text); outline:none;}
  #q:focus{border-color:var(--accent);}
  #themeBtn{background:var(--panel); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:8px 10px; cursor:pointer; font-size:14px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; max-width:1000px; margin:10px auto 0;}
  .chip{font-size:12.5px; padding:4px 10px; border-radius:999px; border:1px solid var(--border);
        background:var(--panel); color:var(--muted); cursor:pointer; user-select:none;}
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .cheat{max-width:1000px; margin:8px auto 0; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:12px;}
  .cheat b{color:var(--accent);}
  main{max-width:1000px; margin:14px auto; padding:0 18px;}
  .hint{color:var(--muted); font-size:13px; margin:6px 0 12px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 4px rgba(60,50,30,0.06);}
  .card.top{border-left:3px solid var(--accent);}
  .qline{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .qtext{font-weight:700; font-size:15.5px;}
  .badge{font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel2); color:var(--teal); white-space:nowrap;}
  .badge.slide{color:var(--green); font-weight:700;}
  .ans{margin-top:8px; font-size:14.5px; line-height:1.55; color:var(--text);}
  .ans b{color:var(--accent);}
  .ans code{background:var(--panel2); padding:1px 5px; border-radius:4px; font-size:13px;}
  pre{background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px;
      margin-top:8px; overflow-x:auto; font-size:12.5px; line-height:1.45; white-space:pre-wrap;}
  mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 1px;}
  details{margin-bottom:8px;}
  details summary{cursor:pointer; padding:9px 12px; background:var(--panel); border:1px solid var(--border);
      border-radius:10px; font-size:14.5px; font-weight:600; list-style:none; display:flex; gap:8px; align-items:baseline;
      box-shadow:0 1px 3px rgba(60,50,30,0.05);}
  details summary::before{content:'▸'; color:var(--accent); font-size:12px;}
  details[open] summary::before{content:'▾';}
  details .ans, details pre{margin-left:12px; margin-right:2px;}
  details .ans{margin-top:6px; margin-bottom:6px;}
  .grp{margin:20px 0 8px; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); font-weight:700;}
  .none{color:var(--muted); padding:30px 0; text-align:center;}
  kbd{background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:0 5px; font-size:12px;}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>CGAR <span>Giải thích</span></h1>
    <input id="q" type="text" placeholder="Gõ SỐ SLIDE (vd: 16, 19, b4) hoặc từ khóa: domino, cegis, ablation, upper bound..." autofocus autocomplete="off">
    <button id="themeBtn" title="Đổi theme">☾/☀</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="cheat">
    <span>HG2.9K <b>87.1%</b></span><span>GitCham <b>83.2%</b></span><span>avg <b>22.3s</b></span>
    <span>vs o1 <b>+32.0pp</b></span><span>rescue PLLM <b>80.6%</b></span>
    <span>ablation: store <b>−21%</b> · wheel <b>−44%</b> · upper <b>−68%</b></span>
    <span>fail/pass <b>1.31×</b> (PLLM 2.20×)</span>
  </div>
</header>
<main>
  <div class="hint">Thầy kêu bật slide nào → gõ <b>số slide đó</b> là ra mọi điểm cần giải thích. <kbd>Esc</kbd> xóa. Để trống = duyệt theo phần.</div>
  <div id="out"></div>
</main>

<script>
const CATS = {"baitoan":"1. Bài toán / cấu hình","memres":"2. MEMRES","cgar":"3. CGAR (agent, vòng lặp)","rangbuoc":"4. Chi tiết ràng buộc","ketqua":"5. Kết quả","prompt":"6. Prompt từng agent","math":"7. Ký hiệu toán"};

// ==================== NGÂN HÀNG GIẢI THÍCH ====================
// Nguyên tắc: KHÔNG lặp lại thứ đã in trên slide. Mỗi entry = một điểm
// thầy có thể chỉ vào slide và bảo "giải thích đi": vì sao / cơ chế / ý nghĩa.
// q: điểm cần giải thích · slide: slide nào · ord: thứ tự duyệt · keys: từ khóa thêm
const DB = [{"q":"Hiệu ứng domino là gì? (thầy hỏi nhanh)","cat":"baitoan","slide":"6","ord":1,"keys":"domino day chuyen keo theo requires python numpy cu abi giai quyet xu ly hien tuong domino cgar solver assignment ca bo prune upper","a":"Chọn version cho 1 gói không đứng một mình, nó kéo theo cả dây:<br>• Muốn chạy <code>imread</code> thì buộc scipy cũ (≤ 1.2).<br>• scipy 1.2 chỉ chạy tới Python 3.7 → buộc Python ≤ 3.7.<br>• Python 3.7 lại kéo numpy về bản cũ tương thích.<br>→ Một lựa chọn đổ xuống làm đổ cả hàng, như domino. Nên không chọn từng gói riêng được, phải chọn cả <b>bộ version</b> hợp nhau.<br><b>CGAR giải quyết thế nào:</b><br>• Dựng miền D từ PyPI cho từng package, lọc theo Python và ưu tiên wheel.<br>• Solver ghép <b>cả assignment</b> cùng lúc, ví dụ Python + scipy + numpy, rồi mới đưa 1 bộ vào Docker.<br>• Nếu Docker fail, Analyzer biến lỗi thành constraint. Ví dụ <code>cannot import name imread</code> → <code>scipy &lt; 1.3</code>.<br>• Solver vòng sau không chỉ đổi scipy một điểm; nó prune cả vùng version và chọn lại cả bộ tương thích hơn.<br><b>Chốt:</b> domino được xử lý bằng cách chọn theo combo + học constraint từ Docker fail, không vá từng package rời rạc."},{"q":"CGAR gồm những phần gì? (mô tả bằng lời)","cat":"baitoan","slide":"repo","ord":2,"keys":"source cau truc file module o dau implement gom nhung phan gi mo ta cau truc thanh phan lam gi boc len memres","a":"CGAR không viết lại từ đầu, mà <b>bọc thêm một lớp chọn version có ràng buộc</b> lên pipeline MEMRES. Các phần chính (nói bằng lời):<br>• <b>CandidateGraphBuilder:</b> lên PyPI lấy các version của gói, lọc cứng theo Python, đánh dấu/ưu tiên bản có wheel Linux vì cài nhanh, rồi giữ top-8 bản đầu sau khi sort.<br>• <b>ConstraintSolver:</b> ghép version cho các gói sao cho không phạm ràng buộc đã học; bước này thuần logic, không đụng Docker.<br>• <b>Constraint Store:</b> lưu các bài học từ lỗi: version nào cấm, combo nào hỏng, cận trên nào; store sống trong cả session để snippet sau dùng lại.<br>• <b>Analyzer/Critic:</b> đọc log Docker fail, biến lỗi thành HARD/SOFT/UPPER; Critic chỉ nhảy vào khi kẹt nhiều lần.<br>• <b>Coordinator/Executor:</b> nối các phần trên vào vòng build thật của MEMRES.<br><b>Chốt: CGAR = MEMRES + miền ứng viên từ PyPI + solver có ràng buộc + học từ lỗi Docker.</b>"},{"q":"Hai loại K (Ksolve=50 vs Kbuild≤10) khác nhau chỗ nào? Vì sao tách 2 con số? (budget, trần 1800s)","cat":"baitoan","slide":"5","ord":3,"keys":"ngan sach 1800 k solve k build ksolve kbuild 50 10 180 wall clock hai 2 loai k tach vi sao gop test to hop combo verify docker suy luan logic re dat cheap expensive budget rule based rule-based khong llm 4 luat loai chon tham lam kiem bo quay so odometer thu nhap la gi la thu kieu gi cai san deterministic micro giay vi sao can ksolve neu khong co co loi gi co ksolve tac dung gi tranh docker dat thu nhap tren giay prune truoc build","a":"Bối cảnh trước: <b>1800s là wall-clock budget do ban tổ chức/harness cấp cho mỗi snippet</b>. Trong 1800s đó, nhóm em chia việc thành 2 tầng: xử lý tổ hợp rẻ trước, rồi mới đem 1 bộ đi build thật.<br><b>Vì sao cần Ksolve?</b><br>• Nếu <b>không có Ksolve</b>: mỗi khi cần đổi version, hệ phải đem thẳng một bộ vào Docker. Sai một bộ là mất tới 180s; nhiều package thì thành thử-sai rất đắt, gần brute force bằng Docker.<br>• Nếu <b>có Ksolve</b>: hệ thử nháp nhiều assignment trong bộ nhớ trước, né version/combo đã biết hỏng, rồi chỉ đem <b>1 bộ đáng thử nhất</b> đi Docker. Nói cách khác: trả vài micro giây để tránh trả 180s vô ích.<br>• Ksolve không chứng minh “đúng tuyệt đối”; nó là tầng <b>lọc rẻ trước verifier đắt</b>.<br>• <b>Vì sao chọn 50:</b> đây là hằng số kỹ thuật nhóm em tự chọn để cân bằng. Ít quá, ví dụ 5-10, thì với snippet có nhiều package, solver có thể chưa kịp né các combo/version đã fail để tìm assignment tốt. Nhiều quá, ví dụ vài trăm-vài nghìn, thì không gian tổ hợp phình theo số package và phần duyệt trước-build bắt đầu ăn vào 1800s wall-clock. 50 là mức đủ cho solver thử nhiều tổ hợp rẻ, nhưng vẫn giữ phần lớn ngân sách cho Docker verifier.<br>• <b>Ksolve ≤ 50: xử lý tổ hợp TRƯỚC khi build.</b> Đây không phải 50 lần Docker, mà là tối đa 50 lần solver duyệt các assignment trong bộ nhớ để tìm một bộ không phạm ràng buộc đã học.<br>&nbsp;&nbsp;Bước RULE-BASED thuần (KHÔNG LLM, KHÔNG Docker), chỉ so version trong bộ nhớ nên rất rẻ so với Docker. \"Thử nháp\" = chạy 4 luật cố định:<br>&nbsp;&nbsp;<b>1. Loại:</b> bỏ version đang bị cấm trong Store (HARD, hoặc SOFT đã ≥2 lần, hoặc ≥ cận trên UPPER).<br>&nbsp;&nbsp;<b>2. Chọn tham lam:</b> mỗi gói nhặt bản ĐẦU còn sống trong danh sách đã sort (wheel trước, mới-nhất trước) → được 1 bộ.<br>&nbsp;&nbsp;<b>3. Kiểm bộ:</b> nếu bộ này từng fail cùng nhau (combo) hoặc trùng bộ vừa Docker-fail → không nhận.<br>&nbsp;&nbsp;<b>4. Quay số (odometer):</b> đổi gói cuối trước, hết thì nhích gói trước reset gói sau, thử bộ kế; lặp tối đa 50 lần rồi thôi.<br>&nbsp;&nbsp;\"Ngon\" = mới nhất + wheel + không phạm ràng buộc, KHÔNG phải chấm điểm 50 bản; số 50 chỉ là trần số lần quay-số khi bộ đầu bị loại.<br>• <b>Kbuild ≤ 10: thử THẬT bằng Docker (đắt).</b> Lấy 1 bộ solver chọn, dựng Docker cài thật rồi chạy import, mỗi lần tới <b>180s</b>. Tối đa 10 lần/snippet (trần 1800s = 10×180s).<br>• <b>Vòng chạy:</b> Ksolve lọc trên giấy → chọn 1 bộ → Kbuild Docker thử thật → lỗi thì học ràng buộc → Ksolve lại né ràng buộc mới → Docker lần sau... tối đa 10 lần Docker.<br><b>Chốt: 1800s là ngân sách thật bên ngoài; Ksolve=50 là cap thực dụng để lọc tổ hợp trong bộ nhớ trước. Ít quá dễ chưa tìm tới bộ tốt; nhiều quá thì phình theo số package và lấn budget Docker.</b>"},{"q":"Thời gian reasoning (suy luận) có tính vào budget không? Nó là gì, nằm ở đâu? K-solve trước hay sau K-build?","cat":"baitoan","slide":"5","ord":4,"keys":"reasoning suy luan thoi gian time tinh vao budget wall clock nam o dau truoc sau xen ke ksolve kbuild llm call ollama gemma solver logic overhead do dau khong network pypi 22.3s","a":"• <b>CÓ, tính hết vào wall-clock.</b> Budget 1800s và avg (CGAR 22.3s) đều đo TẤT CẢ thời gian thật: Docker build + gọi LLM + solver + tải PyPI. Không có chuyện reasoning không tính.<br>• <b>K-solve đứng TRƯỚC K-build, xen kẽ:</b> vòng lặp = nghĩ (solve) → thử thật (build) → lỗi thì nghĩ tiếp → solve lại → build lại. Mỗi build có 1 solve trước nó.<br>• <b>Reasoning gồm 2 phần:</b> (1) solver ghép trên giấy = micro giây, gần như 0; (2) gọi LLM (Planner/Analyzer/Critic qua Ollama Gemma-2 9B) ~1-2s/lần nhưng CGAR gọi rất ít (~0.31 lần/snippet). Cộng GET PyPI (mạng), nhỏ.<br>• <b>Lưu ý:</b> Ksolve=50 và Kbuild≤10 là giới hạn SỐ LẦN, không phải 2 túi thời gian riêng; chỉ có 1 túi thời gian = 1800s wall-clock.<br><b>Chốt: reasoning tính hết vào wall-clock, nhưng nhỏ như số lẻ so với build 180s. 22.3s gần như toàn bộ là thời gian build, không phải nghĩ.</b>"},{"q":"GitChameleon convert thế nào để chạy được trong harness?","cat":"baitoan","slide":"8, repo","ord":5,"keys":"convert adapter gitchameleon jsonl snippet ghep starting_code solution test la gi khac gnhau bullet dam bao chay tho import assert than ham khung ham loi giai giau version ground_truth chat hon hg2k test that hanh vi","a":"<b>Chuyển GitChameleon về đúng layout hard-gists để cả 3 tool chạy CHUNG 1 adapter (không tool nào có format riêng):</b><br>• Nguồn: <code>final_fix_dataset.jsonl</code> (328 example). Mỗi example có 3 phần, nối lại thành 1 file <code>snippet.py</code> chạy được.<br><b>3 phần đó là gì:</b><br>• <b>starting_code</b> = phần CHO SẴN: các import + khung hàm (chữ ký). VD: <code>import torch</code> rồi <code>def log_ndtr(x): ...</code>.<br>• <b>solution</b> = THÂN hàm, tức lời giải đúng dùng API của thư viện. VD gọi <code>scipy.stats.norm.logcdf(...)</code>.<br>• <b>test</b> = đoạn <code>assert</code> kiểm kết quả đúng. VD <code>assert torch.allclose(...)</code>.<br><b>Ba phần khác nhau không:</b> khác VAI (đề / lời giải / bài kiểm) trong bench gốc, nhưng với tool mình thì <b>nối làm 1 file duy nhất</b>. Resolver KHÔNG thấy chia tách, chỉ thấy import và phải tìm version sao cho cả file chạy trọn + test pass.<br><b>Điểm quan trọng:</b> version KHÔNG ghi vào snippet, tool phải tự suy từ import (giống HG2.9K). Ground-truth (python, thư viện, version) để riêng ở <code>ground_truth.csv</code>, chỉ dùng để chấm, không cho tool thấy.<br><b>Vì sao chặt hơn HG2.9K:</b> HG2.9K chỉ cần import chạy; GitChameleon có <b>test thật</b>, chọn sai version thì API trong solution không có hoặc test fail, không qua. Nên pass ở đây = đúng cả hành vi.<br><b>Chốt: nối starting_code (đề) + solution (lời giải) + test (kiểm) thành 1 snippet chạy được, giấu version; cả 3 tool dùng chung adapter nên công bằng.</b>"},{"q":"Agent là gì? Khác một lần gọi LLM API thường chỗ nào?","cat":"cgar","slide":"15","ord":1,"keys":"agent la gi dinh nghia khac api call thuong perceive act","a":"Agent = LLM đặt trong vòng lặp <b>perceive → decide → act → observe</b>: nó thấy trạng thái (log lỗi, constraint store), quyết định, gọi <b>tool</b> (query PyPI, build Docker), rồi quan sát kết quả và hành động tiếp theo <b>thay đổi theo feedback</b>. Một lần gọi API thường là one-shot: hỏi, đáp, hết. Trong CGAR, feedback của verifier thực sự đổi hành vi vòng sau (qua constraint store), nên nó là agent loop đúng nghĩa chứ không phải gọi LLM được dán nhãn agent."},{"q":"Cái này có phải agent thật không? Hay chỉ là hỏi LLM one-shot?","cat":"cgar","slide":"15-16","ord":2,"keys":"co phai agent that khong one shot hay chi hoi llm mot lan dressed up call vong lap feedback perceive decide act observe loop trang thai state phan hoi docker doi hanh vi","a":"Là agent THẬT, không phải one-shot, vì có <b>vòng lặp có phản hồi</b>:<br>• Agent hành động (chọn version / đọc lỗi / pivot) → gọi TOOL (PyPI, Docker, ghi Store) → QUAN SÁT kết quả (pass/fail) → hành động tiếp DỰA TRÊN quan sát đó.<br>• Một lỗi Docker biến thành constraint, khiến Planner vòng sau chọn KHÁC. Đó là loop có trạng thái, không phải call rời rạc.<br>• Bằng chứng: Analyzer chỉ chạy khi Executor báo FAIL; Critic chỉ chạy khi 3 lỗi liên tiếp cùng loại; Store tích lũy qua các vòng. Bỏ feedback đi thì hệ sập về đoán mò như PLLM.<br><b>Nói cho chuẩn:</b> mỗi lần gọi LLM riêng lẻ đúng là một call ngắn (128/96 token), nhưng cái làm nó agentic KHÔNG phải độ dài mỗi call, mà là vòng lặp perceive → decide → act → observe với feedback từ Docker. Multi-agent chính đáng vì mỗi vai vá một failure mode có tên (Analyzer sinh constraint, Critic pivot), không phải một call bị dán nhãn agent.<br><b>Chốt: agent thật vì lỗi Docker được biến thành constraint dẫn dắt lần chọn sau, không phải hỏi 1 câu trả 1 đáp rồi hết.</b>"},{"q":"Giải thích vai trò từng agent, vì sao tách 3 mà không gộp 1?","cat":"cgar","slide":"15","ord":3,"keys":"ba agent vai tro planner analyzer critic tach vi sao khong mot","a":"Nói chuẩn là <b>3 LLM agent + 1 Executor tool</b>:<br>• <b>Planner agent:</b> chọn version cho mỗi gói. Đọc top-8 candidates, constraints đã học, nháp của solver; xuất 1 bộ version đem đi build. Token cap 128.<br>• <b>Executor tool:</b> không phải LLM. Nó dựng Docker, cài đúng bộ version đó, chạy snippet/import/test, rồi trả pass hoặc fail kèm log.<br>• <b>Analyzer agent:</b> chỉ chạy khi fail. Đọc log, phân loại lỗi HARD/SOFT/UPPER, ghi constraint mới vào Store. Token cap 128.<br>• <b>Critic agent:</b> chỉ chạy khi kẹt: <b>3 lỗi liên tiếp cùng error_type</b>. Nhìn chuỗi lỗi và đề xuất continue / switch_python / mark_unfixable. Token cap 96.<br><b>Vì sao tách 3 agent LLM:</b><br>• Mỗi vai cần thông tin khác nhau → prompt ngắn, tập trung → model 9B nhỏ vẫn ổn.<br>• Output mỗi vai có schema riêng → dễ kiểm tra, dễ fallback khi LLM trả sai format.<br>• Gộp hết vào một prompt lớn thì khó debug: không biết lỗi do chọn version, đọc log, hay quyết định pivot.<br><b>Chốt: Planner chọn, Analyzer học, Critic thoát kẹt; Executor là trọng tài Docker, không phải LLM.</b>"},{"q":"Mỗi agent là 1 LLM riêng à? Mỗi lần gọi agent là 1 lần gọi LLM à?","cat":"cgar","slide":"S15/B4","ord":4,"keys":"moi agent 1 llm rieng model chung shared gemma-2 9b ollama prompt vai role planner analyzer critic executor khong phai llm nhieu prompt khong phai 4 model gpu moi lan goi agent la goi llm co prompt rieng chon loc","a":"<b>Mỗi agent một mô hình riêng?</b> Không: cả 3 agent LLM dùng CHUNG một Gemma-2 9B trên một Ollama; khác nhau chỉ là PROMPT (mỗi vai một lời nhắc riêng).<br><b>Mỗi lần gọi agent là một lần gọi mô hình?</b><br>• Planner, Analyzer, Critic: <b>đúng</b>: mỗi cái có prompt riêng nên mỗi lần chạy là một lần gọi mô hình.<br>• Executor: <b>không</b>: nó là công cụ dựng Docker, không gọi mô hình.<br><b>Nên \"nhiều agent\" = nhiều VAI (nhiều prompt) trên cùng một bộ não</b>, không phải 4 mô hình hay 4 GPU. Chỉ 1 model 9B nằm trong bộ nhớ.<br><b>Vì sao tổng số lần gọi vẫn nhỏ:</b> không vòng nào cũng gọi đủ 3 vai. Planner gọi mỗi vòng; Analyzer chỉ khi build fail; Critic chỉ khi kẹt: 3 lỗi liên tiếp cùng error_type. Đa số snippet xong trong 1-2 vòng.<br><b>Chốt: 1 model, nhiều prompt. Planner/Analyzer/Critic mỗi lần chạy là 1 lần gọi mô hình, Executor thì không; gọi chọn lọc nên tổng vẫn ít.</b>"},{"q":"Các agent giao tiếp thế nào? Cái nào qua cái nào? (B2)","cat":"cgar","slide":"B2/33","ord":5,"keys":"giao tiep message flow coordinator khong goi truc tiep b2 giao tiep cai nao qua cai nao luong flow bang chung shared store coordinator dieu phoi khong goi thang truc tiep planner executor analyzer critic thu tu order message di dau","a":"<b>Cốt lõi: các agent KHÔNG gọi thẳng nhau.</b> Chúng làm việc qua một Bảng chung (Session Store) + một người điều phối (coordinator) chuyền tin. Giống nhóm làm bài dán giấy note lên bảng, không ai gọi điện riêng.<br><b>Luồng một vòng:</b><br>• 1. <b>Planner</b> đọc Bảng chung (ràng buộc đã học) → chọn bộ version → đưa Executor.<br>• 2. <b>Executor</b> dựng Docker thử thật → trả kết quả (pass, hoặc fail + log lỗi).<br>• 3. Nếu fail: <b>Analyzer</b> đọc log → biến lỗi thành ràng buộc (vd scipy &lt; 1.3) → ghi lên Bảng chung.<br>• 4. Vòng sau <b>Planner</b> đọc Bảng chung trước khi chọn → tự né lỗi cũ.<br>• 5. Nếu bí (<b>3 lỗi liên tiếp cùng loại</b>): <b>Critic</b> nhảy vào đổi chiến lược (đổi Python / bỏ cuộc).<br><b>Chốt: không agent nào gọi thẳng agent kia; coordinator chuyền tin + Bảng chung để ghi cho nhau đọc. Nhờ vậy thêm/bớt 1 agent không làm vỡ hệ.</b>"},{"q":"Giải thích vòng lặp: đi qua một iteration cụ thể","cat":"cgar","slide":"16","ord":6,"keys":"vong lap loop buoc iteration co che chay the nao","a":"Đi qua 1 vòng cụ thể (ví dụ gói scipy + numpy):<br>• <b>1. Planner:</b> lấy ứng viên từ PyPI, né ràng buộc đã học, chọn 1 bộ (vd scipy 1.7.3 + numpy 1.21.6).<br>• <b>2. Executor:</b> dựng Docker, cài bộ đó, chạy import. OK thì XONG. Fail thì đưa log cho Analyzer.<br>• <b>3. Analyzer:</b> đọc log (vd cannot import name imread), hiểu scipy phải &lt; 1.3, ghi ràng buộc UPPER vào Store.<br>• <b>4. Critic (chỉ khi bí):</b> nếu 3 lỗi liên tiếp cùng loại thì đề xuất đổi Python hoặc bỏ cuộc.<br>• <b>Quay lại Planner:</b> giờ Store đã có scipy &lt; 1.3 → Planner chọn scipy 1.2.3 → build OK.<br><b>Điều phối bởi coordinator; agent không gọi thẳng nhau, nói chuyện qua Store.</b>"},{"q":"Thầy bảo kể một ví dụ luồng xử lý end-to-end: đầu tiên làm gì, rồi làm gì?","cat":"cgar","slide":"S16/S18","ord":6.2,"keys":"vi du luong xu ly end to end dau tien lam gi roi lam gi flow pipeline step by step imread scipy pypi top 8 solver docker analyzer constraint store upper bound planner executor pass","a":"<b>Nói theo một case cụ thể: code có <code>from scipy.misc import imread</code>.</b><br><b>Luồng từ đầu tới cuối:</b><br>• <b>1. Nhận code:</b> hệ đọc snippet, static analysis thấy import <code>scipy</code>. Lúc này chưa biết scipy version nào đúng.<br>• <b>2. Dựng miền ứng viên:</b> CandidateGraphBuilder gọi PyPI cho scipy, lọc theo Python đang nhắm, ưu tiên wheel + bản mới, giữ top-8. Ví dụ đầu danh sách có <code>1.10.1, 1.9.3, 1.7.3...</code>.<br>• <b>3. Solver ghép trên giấy:</b> Store ban đầu rỗng nên solver chọn bản mới nhất còn sống, ví dụ <code>scipy==1.10.1</code>. Đây chỉ là 1 assignment, chưa build 8 bản.<br>• <b>4. Planner chốt phương án:</b> Planner nhận nháp của solver + candidates + constraints, rồi xuất bộ version đem đi thử.<br>• <b>5. Executor thử thật:</b> Docker cài <code>scipy==1.10.1</code>, chạy snippet. Build có thể OK nhưng runtime fail: <code>cannot import name imread from scipy.misc</code>.<br>• <b>6. Analyzer đọc lỗi:</b> Analyzer thấy đây là API removed, suy ra luật <code>scipy &lt; 1.3</code>, ghi vào Constraint Store dưới dạng UPPER bound.<br>• <b>7. Quay lại solver:</b> lần sau solver không dò 1.9, 1.8, 1.7 nữa; nó cắt cả vùng <code>&gt;=1.3</code> và chọn bản cao nhất dưới trần, ví dụ <code>scipy==1.2.3</code>.<br>• <b>8. Executor thử lại:</b> Docker cài <code>scipy==1.2.3</code>, chạy lại import. Nếu OK thì kết thúc; nếu vẫn fail thì lỗi mới lại quay về Analyzer/Critic.<br><b>Điểm cần nhấn:</b><br>• Docker mỗi vòng chỉ build <b>1 bộ version</b>, không build cả top-8.<br>• Mỗi fail không bị bỏ phí: fail biến thành constraint, constraint làm vòng sau né cả vùng version.<br>• Coordinator điều phối vòng lặp; agent không gọi trực tiếp nhau, chúng trao đổi qua log + Store.<br><b>Chốt miệng:</b> code → tìm import → lấy top-8 từ PyPI → solver chọn 1 bộ → Docker kiểm thật → lỗi → Analyzer học constraint → solver chọn lại → Docker pass."},{"q":"Giải thích build loop & anti-hallucination (backup B5)","cat":"cgar","slide":"B5/36","ord":7,"keys":"build loop chong ao giac validate 10 attempt salvage","a":"<b>Vòng build mỗi snippet:</b><br>• Reset trạng thái per-snippet, nhưng giữ Constraint Store của session.<br>• Lặp tối đa K_build lần: Planner chọn → Executor build/run → nếu fail thì Analyzer học constraint → nếu kẹt thì Critic pivot.<br>• Pass là dừng; hết budget hoặc không còn assignment thì fallback/mark fail theo harness.<br><b>Anti-hallucination là gì:</b><br>• Hallucination = LLM bịa version không tồn tại, loại lỗi lạ, hoặc action ngoài thiết kế.<br>• Cách chặn: LLM chỉ được trả trong <b>tập giá trị hợp lệ</b>, ra ngoài thì discard/fallback:<br>• Planner: version phải nằm trong candidate graph thật từ PyPI; bịa bản lạ thì dùng rule_pick/solver.<br>• Analyzer: type chỉ là HARD/SOFT/UPPER; khác thì bỏ.<br>• Critic: action chỉ là continue / switch_python / mark_unfixable.<br>• JSON hỏng thì regex salvage; timeout/rỗng thì chạy đường rule-only.<br><b>Chốt: LLM có quyền gợi ý trong khung hẹp; quyết định cuối vẫn bị candidate graph, schema và Docker verifier khóa lại.</b>"},{"q":"Sao không bỏ bớt agent đi rồi xem kết quả? Bớt 1 agent thì sao?","cat":"cgar","slide":"S15/S16","ord":8,"keys":"bo bot agent bot 1 agent ablation anh huong system hong chuc nang planner analyzer critic executor bo tung vai mat kha nang hoc thoat ket vi sao khong thua sap chua thu ablation tung agent rieng role based analysis neu bo agent khong dung ky vong","a":"<b>Trả lời gọn và an toàn:</b> hệ được thiết kế theo kiểu <b>chia việc cho từng vai</b>, nên bỏ một vai thì hệ không còn là CGAR đầy đủ và khó hoạt động đúng như kỳ vọng.<br>• <b>Planner:</b> là vai chọn version có đọc candidate graph + constraints. Bỏ Planner thì chỉ còn fallback/cascade/rule-only, mất phần chọn version agentic.<br>• <b>Analyzer:</b> là vai biến Docker fail thành HARD/SOFT/UPPER. Bỏ Analyzer thì Store không học ràng buộc mới; vòng sau chủ yếu chỉ né điểm đã fail, không cắt được cả vùng version.<br>• <b>Critic:</b> là vai xử lý khi bị kẹt nhiều lần. Bỏ Critic thì hệ vẫn có thể chạy, nhưng các ca cần đổi chiến lược như đổi Python hoặc mark unfixable sẽ khó thoát sớm.<br>• <b>Executor:</b> là Docker verifier. Bỏ Executor thì không còn tín hiệu thật để biết môi trường pass/fail, nên bài toán chỉ còn đoán trên giấy.<br><b>Nói thật nếu thầy hỏi số liệu:</b> nhóm em <b>chưa làm ablation riêng kiểu bỏ từng agent một</b>. Ablation hiện tại là theo thành phần hệ thống như session store, wheel filter, upper bound. Còn câu “bỏ agent nào thì mất gì” là phân tích theo thiết kế pipeline, không phải claim số liệu thực nghiệm riêng.<br><b>Chốt miệng:</b> vì CGAR phân công rõ Planner chọn, Analyzer học, Critic thoát kẹt, Executor kiểm thật; bỏ vai nào thì mất đúng chức năng đó, nên hệ sẽ không còn chạy đúng kỳ vọng ban đầu."},{"q":"PLLM và MEMRES đều có history / previous attempt. Bộ nhớ của CGAR khác gì họ? (mô tả 3 tool)","cat":"cgar","slide":"S12","ord":9,"keys":"pllm memres cgar previous attempt history bo nho memory khac gi reflexion constraint store nho diem vung logic menh de retry ghi chu chia se cheo snippet mo ta 3 tool so sanh","a":"<b>Cả 3 đều dùng thông tin từ lần thử trước, nhưng mức “có cấu trúc” khác nhau:</b><br>• <b>PLLM:</b> previous attempt/history chủ yếu là <b>log thô + câu trả lời cũ trong prompt</b>. Model đọc lại và đoán tiếp. Có thể né lỗi, nhưng không có store typed constraint, không có rule buộc solver phải loại một vùng version.<br>• <b>MEMRES:</b> memory/reflexion có tổ chức hơn PLLM: có oracle/session memory, reflexion note, confidence cascade. Nó nhớ “đã thử gì, lỗi gì, bài học gì” và dùng các ghi chú đó để retry khôn hơn. Nhưng tri thức vẫn phần lớn là <b>text/ghi chú/điểm đã thử</b>, nên thường né theo điểm hoặc theo lời khuyên mềm.<br>• <b>CGAR:</b> Constraint Store biến lỗi thành <b>ràng buộc có kiểu</b> (HARD / SOFT / UPPER). Không chỉ nhớ “version X fail”, mà học luật cắt vùng: lỗi imread → <code>scipy &lt; 1.3</code> → loại nguyên khoảng [1.3, ∞). Ràng buộc này còn được chia sẻ trong session.<br><b>Khác biệt cốt lõi:</b><br>• PLLM = nhớ log để LLM đoán lại.<br>• MEMRES = viết reflection/tips để retry thông minh hơn.<br>• CGAR = học constraint formal-ish để solver prune bắt buộc.<br><b>Chốt: cùng có history, nhưng độ mạnh tăng dần: raw prompt history → reflection text memory → typed constraint memory.</b>"},{"q":"Giải thích vì sao so sánh này công bằng (fairness)","cat":"ketqua","slide":"22","ord":1,"keys":"fairness cong bang ngan sach giong nhau budget same","a":"Mọi tool: <b>cùng LLM</b> (Gemma-2 9B), <b>cùng Docker harness</b>, <b>cùng budget</b> ≤10 build × 180s ≈ 1800s/snippet, 1 worker, cùng dataset split. CGAR chỉ dùng ≤5 build là hội tụ → thời gian thấp là do <b>hội tụ nhanh</b>, không phải được ưu ái budget. Các số baseline KG (PyEGo, ReadPyE) và PLLM đều do nhóm tự reproduce trong cùng harness, không lấy số paper suông."},{"q":"Cấu hình thí nghiệm của mình là gì? PLLM paper dùng máy mạnh hơn thì so sánh có fair không?","cat":"ketqua","slide":"22","ord":1.5,"keys":"cau hinh hardware setup ollama 0.21.2 gemma2 latest nvidia rtx 5070 vram 12227 mib 12gb driver 581.57 so lan chay full run baseline benchmark harness pllm a40 epyc fair","a":"<b>Cấu hình nhóm em dùng:</b><br>• <b>Ollama:</b> 0.21.2, model <code>gemma2:latest</code> (~5.4GB).<br>• <b>GPU:</b> Nvidia GeForce <b>RTX 5070</b>.<br>• <b>VRAM:</b> 12227 MiB, xấp xỉ <b>12GB</b>.<br>• <b>Driver:</b> Nvidia 581.57.<br>• <b>Số lần chạy:</b> báo cáo theo <b>1 full run cho mỗi tool/baseline trên cùng benchmark/harness</b>; không claim là trung bình multi-seed.<br><br><b>So với PLLM paper:</b> PLLM paper dùng server mạnh hơn: AMD EPYC 7713, 256 CPUs, Nvidia A40 48GB. Vì vậy em không so thời gian chéo paper-vs-local; em so PLLM/MEMRES/CGAR khi chạy lại trên cùng máy RTX 5070.<br><b>Chốt:</b> cấu hình local yếu hơn A40, nên điểm fair là các baseline được chạy cùng một môi trường của nhóm em."},{"q":"9B vs o1: nếu thầy nói KHÔNG FAIR? (và 2 câu đuổi: con số vô nghĩa à? o1 em tự chạy à?)","cat":"ketqua","slide":"24","ord":2,"keys":"9b thang o1 200b vi sao system design closed khong fair khong cong bang unfair cross task khac de khap khieng bao chua thay hoi van phan bien beats o1 nho thang lon open pllm memres bang so cung harness feedback docker doc san code generalization tong quat hoa ood do do vo nghia y nghia con so tu chay cite trich dan paper gitchameleon 2.0 2507.12367 nguon closed model self run","a":"<b>Ý chính (nói ngắn):</b> Không nên đọc slide này thành “Gemma-2 9B đánh bại o1”, vì <b>hai con số không cùng giao thức chạy</b>.<br><br><b>o1 trong GitChameleon là gì?</b><br>• Đây là baseline closed-model được paper GitChameleon báo cáo. Nó nhận bài lập trình/code task rồi sinh lời giải theo kiểu model mạnh suy luận một lần hoặc ít vòng theo setup của paper.<br>• Nói nôm na: o1 đang làm bài “viết/sửa code để qua test” trong benchmark gốc GitChameleon, chứ không phải chạy pipeline resolver của nhóm em.<br>• Nó không có các module của CGAR như CandidateGraphBuilder, Constraint Store, Docker-feedback loop, Analyzer học UPPER bound, hay session sharing.<br><br><b>CGAR làm bài gì?</b><br>• CGAR nhận sẵn snippet/code trong harness, nhiệm vụ chính là <b>dựng môi trường dependency đúng</b>: suy package/version, build Docker, fail thì học constraint, rồi thử lại tối đa theo budget.<br>• Vì vậy CGAR là method giải dependency-resolution; o1 là số tham chiếu closed-model trên benchmark gốc.<br><br><b>Vậy so sánh để làm gì?</b><br>• Bench GitChameleon đưa vào để đo <b>generalization/OOD</b>: dữ liệu khác HG2.9K, có unit test và breaking-change thật.<br>• Số o1 giúp đặt độ khó: model rất mạnh mà paper báo cáo vẫn chỉ đạt mức đó, nên bộ này không dễ.<br>• Khi CGAR giữ điểm cao trên cùng bộ OOD, ý em muốn nói là method dependency-resolution tổng quát tốt, <b>không phải</b> claim “9B công bằng hơn o1”.<br><br><b>Thầy hỏi đuổi 1 - con số o1 vô nghĩa à?</b> Không vô nghĩa. Nó là mốc độ khó và mốc tham khảo từ paper, nhưng không dùng để kết luận thắng-thua trực tiếp vì protocol khác.<br><br><b>Thầy hỏi đuổi 2 - o1 em tự chạy à?</b> KHÔNG. Số o1 và GPT-4o lấy từ paper GitChameleon 2.0 (arXiv 2507.12367). Em chỉ tự chạy lại PLLM, MEMRES, CGAR trong cùng harness. Số closed-model là trích dẫn, có ghi nguồn.<br><br><b>Chốt miệng:</b> o1 là reference closed-model của paper để cho thấy benchmark khó; CGAR là resolver chạy Docker-feedback. Em không claim so sánh fair tuyệt đối, chỉ dùng GitChameleon để chứng minh CGAR không chỉ hợp với HG2.9K."},{"q":"CGAR chạy 5 vòng build, MEMRES 10 vòng: \"nhanh hơn\" là do thuật toán hay do bạn cho ít ngân sách hơn?","cat":"ketqua","slide":"S18","ord":3,"keys":"5 vong 10 vong build loop budget ngan sach khac nhau confound nhanh do thuat toan hay it vong gitchameleon cung 5 vong 1.64 pass-only 17.6 fail pass ratio 1.31 tia rang buoc cong bang","a":"<b>Câu này phải trả lời rất cẩn thận:</b><br>• <b>Không dùng HG2.9K để claim speed tuyệt đối giữa MEMRES và CGAR</b>, vì cấu hình có caveat: MEMRES chạy 10 vòng, CGAR thường hội tụ trong ≤5 vòng. Số HG2.9K dùng tốt nhất để nói accuracy và pass-only cùng-ca, nhưng phải nêu caveat ngân sách.<br>• <b>Speed headline chắc nhất nằm ở GitChameleon:</b> cả PLLM/MEMRES/CGAR cùng K_build=5 → CGAR vẫn median thấp nhất, nhanh hơn MEMRES khoảng <b>1.64×</b> (17.8s vs 30.1s).<br>• <b>Vì sao vẫn nhanh khi cùng budget:</b> fail được chuyển thành constraint, nên vòng sau né cả vùng version; còn retry/memory thông thường thường chỉ né điểm đã thử.<br>• <b>Pass-only HG2.9K:</b> CGAR 17.0s vs MEMRES 299.8s cho thấy trên những ca cả hai cùng giải được, CGAR thường tìm bộ khả thi sớm hơn. Nhưng khi trình bày, nhớ nói đây là bằng chứng phụ và có caveat cấu hình.<br><b>Chốt: claim an toàn là “nhanh do tỉa ràng buộc”; bằng chứng clean nhất là GitChameleon cùng 5 vòng, không phải vì cho CGAR ít ngân sách hơn.</b>"},{"q":"Giải thích nghịch lý: multi-agent gọi LLM nhiều mà lại NHANH nhất?","cat":"ketqua","slide":"22, 25","ord":5,"keys":"nghich ly nhanh multi agent llm cham vi sao 22.3","a":"<b>Đúng là agentic có gọi mô hình vài lần mỗi snippet</b> (Planner mỗi vòng, Analyzer khi fail, Critic khi kẹt). Nhưng vẫn nhanh nhất, vì:<br>• <b>Chi phí thật nằm ở Docker build</b> (~chục đến 180 giây/lần), không phải LLM call (~1-2 giây, 96-128 token, model chạy local). Vài giây suy luận là số lẻ so với build.<br>• <b>Solver + ràng buộc tỉa trước</b> nên CGAR cần rất ít vòng build (thường 1-2, tối đa 5); ít vòng = ít cả gọi mô hình lẫn dựng Docker.<br>• MEMRES/PLLM đốt nhiều vòng build hơn hẳn, mỗi lần fail lại thêm ~180s.<br><b>Chốt: đốt vài giây gọi mô hình để né vài phút build. Multi-agent thêm chút thời gian LLM nhưng cắt nhiều lần build, nên net vẫn nhanh nhất.</b>"},{"q":"Giải thích cách đọc biểu đồ ablation + vì sao upper bound đóng góp lớn nhất","cat":"ketqua","slide":"25","ord":6,"keys":"ablation doc bieu do 71 56 40 23 upper lon nhat","a":"Trên 396 ca MEMRES-fail (ca khó nhất): Full CGAR cứu <b>71</b>. Gỡ từng thành phần một (giữ nguyên phần còn lại): bỏ session store còn 56 (<b>−21%</b>), bỏ wheel filter còn 40 (<b>−44%</b>), bỏ upper bound còn 23 (<b>−68%</b>).<br>Upper bound lớn nhất vì nó là cơ chế duy nhất cắt <b>cả khoảng version</b> trong 1 bước: đúng dạng lỗi chiếm ưu thế trong tập khó (API removed). Mỗi lần chỉ gỡ 1 biến → đóng góp của từng thành phần được cô lập sạch."},{"q":"Có track / đo số lần gọi LLM không? Bao nhiêu? Nhiều agent thì token có fair không?","cat":"ketqua","slide":"22, B4","ord":7,"keys":"track theo doi do so lan goi llm call bao nhieu log ghi dem 0.065 duoi 0.1 97 no-llm khong goi vi sao it solver executor khong phai llm pllm 1-5 memres token fair budget 128","a":"<b>Có track ở mức đủ để giải thích chi phí:</b> log/trace ghi agent nào được gọi, khi nào gọi, và giới hạn token của từng prompt. Nếu cần tính chi tiết tuyệt đối thì đọc từ trace run; còn khi bảo vệ, nói theo cơ chế là an toàn nhất.<br><b>Vì sao số gọi không nổ:</b><br>• Planner gọi ở vòng chọn version; Analyzer chỉ gọi khi Docker fail; Critic chỉ gọi khi kẹt nhiều lần.<br>• Không có chuyện mỗi vòng gọi đủ cả 3 agent nếu không cần.<br><b>Token budget:</b><br>• Planner 128, Analyzer 128, Critic 96 token; prompt ngắn và output JSON.<br>• Executor không gọi LLM, chỉ chạy Docker.<br><b>Fairness:</b><br>• Cùng backbone Gemma-2 9B/Ollama cho nhóm open tool; mọi thời gian LLM đều tính vào wall-clock.<br>• CGAR không nhồi toàn bộ PyPI metadata vào prompt; candidate graph do code dựng nên token không phình như RAG.<br><b>Chốt: nhiều agent là nhiều vai/prompt ngắn, không phải nhiều model; chi phí LLM được tính trong wall-clock và nhỏ hơn Docker build.</b>"},{"q":"\"Result Type: OtherPass\" là gì? Có mấy loại result type?","cat":"ketqua","slide":"S17","ord":9,"keys":"result type otherpass la gi may loai none djangopass pass sach ky thuat runtime error nameerror valueerror typeerror runtimeout timeout system-only appindicator gui importerror modulenotfound syntaxerror fail loi dependency 2500 17 cham diem metric cach ket thuc","a":"<b>Result Type = nhãn cách một snippet kết thúc trong harness.</b> Gom 3 nhóm:<br><b>1. \"None\" = pass sạch:</b> code chạy hết, không lỗi gì (None = không có loại lỗi runtime còn lại).<br><b>2. \"OtherPass\" = pass theo tiêu chí dependency-resolution:</b> môi trường đã dựng được, dependency/import chính đã qua, nhưng đoạn code cuối cùng dính lỗi runtime không được harness xem là lỗi dependency trực tiếp. Vẫn tính PASS vì bài HG2.9K đo khả năng dựng môi trường cho code cũ, không đo đúng sai nghiệp vụ như unit test.<br>&nbsp;&nbsp;Ví dụ: NameError, TypeError, ValueError, KeyError, FileNotFoundError, OSError, ConnectionError, RunTimeout, hoặc lỗi cần tài nguyên ngoài như GUI/file/mạng. Django có nhãn riêng DjangoPass.<br><b>3. Fail = lỗi dependency thật sự:</b> ImportError, ModuleNotFound, SyntaxError, NoMatchingDistribution, CouldNotBuildWheels, InvalidRequirement, FailedToRun... tức môi trường/dependency chưa giải được theo luật benchmark.<br><b>Nếu thầy vặn \"sao NameError/RunTimeout cũng pass\":</b> đây là quy ước chấm của harness và áp dụng giống nhau cho PLLM/MEMRES/CGAR. Với bằng chứng hành vi mạnh hơn, nhóm dùng thêm GitChameleon vì có unit test thật.<br><b>Chốt: HG2.9K pass = dựng được môi trường theo luật benchmark; GitChameleon mới là nơi kiểm thêm hành vi bằng test.</b>"},{"q":"Đọc toàn bộ ký hiệu toán trong slide (bảng ký hiệu)","cat":"math","slide":"S13/S14","ord":1,"keys":"ky hieu toan symbol bang tat ca doc models ⊨ thoa pi π wedge ∧ va and or ∨ empty ∅ rong tuple ⟨⟩ bo set builder | sao cho ∈ thuoc X D C Ct A assignment f(A) verifier hop den → anh xa K solve build μs micro giay le q le q","a":"<b>Ký hiệu logic:</b><br>• <b>⊨</b> (models / thỏa): vế trái thỏa điều kiện vế phải. VD requires_python ⊨ π = \"yêu cầu Python của bản đó chấp nhận π\".<br>• <b>∧</b> (và / AND): cả hai điều kiện cùng đúng. (∨ = hoặc/OR nếu gặp; ¬ = không/NOT.)<br><b>Biến và miền (CSP):</b><br>• <b>π</b> (pi): phiên bản Python đang nhắm tới.<br>• <b>X</b>: tập biến cần tìm (version mỗi gói + Python).<br>• <b>D</b>: miền giá trị (các version được phép gán). <b>Pᵢ</b>: gói thứ i. <b>v</b>: một version.<br>• <b>{ v | điều kiện }</b>: tập các v SAO CHO điều kiện đúng; dấu <b>|</b> = \"sao cho\". <b>∈</b> = thuộc.<br><b>Ràng buộc và trạng thái:</b><br>• <b>C₀ = ∅</b>: ban đầu chưa có ràng buộc nào; <b>∅</b> = tập rỗng.<br>• <b>Cₜ</b>: tập ràng buộc tại bước t (lớn dần).<br>• <b>Sₜ = ⟨X, D, Cₜ⟩</b>: trạng thái tìm kiếm ở bước t; <b>⟨ ⟩</b> = bộ (tuple) gom nhiều thành phần.<br>• <b>A</b>: một phép gán cụ thể (vd scipy=1.2.3). <b>A ⊨ Cₜ</b>: A thỏa mọi ràng buộc trong Cₜ.<br><b>Verifier và số:</b><br>• <b>f(A) → {pass, typed-error}</b>: hàm hộp đen (Docker build); đưa A vào, trả pass hoặc lỗi-có-kiểu; <b>→</b> = \"cho ra\".<br>• <b>≤ , ≥</b>: nhỏ/lớn hơn hoặc bằng (upper bound: v < ub).<br>• <b>K_solve = 50</b>: tối đa 50 lần ghép trên giấy; <b>K_build ≤ 10</b>: tối đa 10 lần build Docker. <b>μs</b> = micro giây.<br><b>Chốt: ⊨ = thỏa, ∧ = và, ∅ = rỗng, ⟨ ⟩ = bộ, { | } = tập sao cho, f(A) = verifier hộp đen.</b>"},{"q":"requires_python ⊨ π ∧ has_wheel nghĩa là gì? (đọc ký hiệu)","cat":"math","slide":"S14","ord":2,"keys":"requires_python models ⊨ pi π wedge ∧ has_wheel nghia la gi doc ky hieu loc version giu neu thoa python co wheel bo loc mien D","a":"<b>Đọc thành lời:</b> \"giữ một version nếu yêu-cầu-Python của nó CHẤP NHẬN π, VÀ nó có wheel\".<br>Bẻ từng ký hiệu:<br>• <b>requires_python</b>: khoảng Python bản đó khai báo hỗ trợ (vd \">=3.7\").<br>• <b>⊨</b> (models / thỏa): π nằm trong khoảng đó thì thỏa. VD \">=3.7\" ⊨ π=3.7 là đúng.<br>• <b>π</b>: phiên bản Python đang nhắm tới cho snippet này.<br>• <b>∧</b>: VÀ, cả hai điều kiện phải cùng đúng.<br>• <b>has_wheel</b>: bản đó có sẵn file wheel Linux (cài nhanh, khỏi build từ nguồn).<br><b>Ý nghĩa:</b> đây là bộ lọc dựng miền D, chỉ giữ version hợp Python đang nhắm.<br><b>Lưu ý (khớp thực tế):</b> công thức viết ∧ cho gọn, nhưng thực tế has_wheel là <b>ưu tiên sắp xếp</b> (bản có wheel lên đầu, giữ top-8) chứ KHÔNG loại cứng bản chỉ có sdist. Chỉ requires_python ⊨ π là điều kiện cứng. (xem câu \"Wheel filter\").<br><b>Chốt: \"bản này hợp Python đang dùng (cứng), và ưu tiên có wheel (mềm)\" thì vào danh sách ứng viên.</b>"},{"q":"Giải thích ký hiệu: f(A), C₀ = ∅, Sₜ = ⟨X, D, Cₜ⟩","cat":"math","slide":"S13","ord":3,"keys":"ky hieu cong thuc f a s t x d c thong so toan","a":"• <b>X</b> = tập biến cần tìm: version của mỗi gói + version Python (ẩn số).<br>• <b>D</b> = miền giá trị: các version ứng viên đã lọc, top-8 mỗi gói (giá trị được phép gán).<br>• <b>A</b> = một cách gán cụ thể (assignment), vd scipy=1.7.3, numpy=1.21.<br>• <b>f(A)</b> = máy chấm hộp đen (Docker build): đưa bộ A vào, trả về pass hoặc lỗi-có-kiểu (typed-error).<br>• <b>C₀ = ∅</b> = lúc đầu chưa có ràng buộc nào (tập rỗng).<br>• <b>Cₜ</b> = tập ràng buộc đã học tới bước t, chỉ lớn dần.<br>• <b>Sₜ = ⟨X, D, Cₜ⟩</b> = trạng thái tìm kiếm ở bước t: X và D gần như cố định, cái tăng lên là Cₜ.<br><b>Chốt: mọi thứ cố định trừ Cₜ; học càng nhiều thì Cₜ càng lớn, không gian càng hẹp.</b>"},{"q":"Vì sao nói MEMRES \"vẫn mù\" dù có memory?","cat":"memres","slide":"12","ord":31,"keys":"van mu retry ghi nho khong suy luan diem yeu","a":"Memory của MEMRES nhớ <b>điểm</b>: \"(scipy, 1.7.3) đã fail\" → lần sau tránh đúng điểm đó, thử 1.7.2, rồi 1.7.1... vẫn fail cùng lý do. Nó nhớ ĐÃ sai nhưng không suy luận VÌ SAO sai, nên không cắt được <b>cả vùng</b> (mọi scipy ≥ 1.3 đều chết vì imread bị bỏ). CGAR thêm đúng mắt xích đó: Analyzer đọc lỗi → suy ra ràng buộc vùng (UPPER bound)."},{"q":"MEMRES: kể tên 4 stage + 2 fast path + 2 memory store?","cat":"memres","slide":"12","ord":32,"keys":"bon stage hai fast path memory store ke ten memres pipeline chi tiet giai thich tung stage hybrid evaluation module cleaning confidence cascade oracle lookup session memory self evolving memory reflexion memory nghia la gi","a":"<b>Nói trước 1 câu:</b> MEMRES là kiểu <b>lookup-first, LLM-last</b>: cái gì tra được/rẻ/chắc thì làm trước, chỉ khi bí mới hỏi LLM hoặc build Docker.<br><b>Pipeline 4 stage:</b><br>• <b>Stage 1 - Hybrid Evaluation:</b> nhìn code để đoán package cần cài. “Hybrid” nghĩa là trộn nhiều tín hiệu: static analysis bắt dòng <code>import</code>, semantic analyzer hiểu alias/tên module, và LLM few-shot chỉ hỗ trợ khi mapping mơ hồ. Ví dụ <code>import cv2</code> không phải package <code>cv2</code>, mà thường là <code>opencv-python</code>.<br>• <b>Stage 2 - Module Cleaning:</b> làm sạch tên module thành tên pip thật. Dùng ErrorPatternKB như một bảng kinh nghiệm: module nào hay map sang package nào, rồi validate lại trên PyPI để tránh bịa package không tồn tại.<br>• <b>Stage 3 - Version Selection:</b> chọn version bằng confidence cascade 6 mức. Nghĩa là thử nguồn đáng tin nhất trước: session memory, compatibility map, template, co-occurrence, heuristic, cuối cùng mới LLM. Mục tiêu là chọn version rẻ và chắc trước khi phải thử Docker.<br>• <b>Stage 4 - Build Loop:</b> dựng Docker thật, cài package/version đã chọn, chạy snippet. Nếu fail thì Reflexion ghi lại bài học/lỗi để lần retry sau tránh lặp đúng sai lầm cũ.<br><b>2 fast path (bắt nhanh ca dễ):</b><br>• <b>Oracle lookup:</b> nếu case này đã có lời giải được chứng minh trong lịch sử/benchmark cache thì replay luôn, khỏi suy luận lại. Nó giống “đã từng làm bài này rồi thì lấy đáp án đã kiểm chứng”.<br>• <b>Session-memory hit:</b> trong cùng batch/repo, nếu một package vừa được giải thành công ở snippet trước, snippet sau dùng lại ngay mapping/version đó. Ví dụ vừa giải được <code>numpy==1.16.6</code> cho Py3.7 thì snippet kế cùng ngữ cảnh không cần đoán lại từ đầu.<br><b>2 memory store:</b><br>• <b>Self-Evolving Memory:</b> bộ nhớ tích lũy mẹo/tips chéo snippet trong cả run, kiểu “project này hay cần package X version Y”. Nó giúp các snippet sau hưởng kinh nghiệm của snippet trước.<br>• <b>Reflexion Memory:</b> bộ nhớ ngắn hơn trong build loop: attempt vừa rồi thử gì, fail vì lỗi gì, bài học là gì. Nó giúp retry kế tiếp không lặp y chang lỗi vừa gặp.<br><b>Phân biệt nhanh:</b> fast path là <b>đường tắt để trả lời ngay</b>; memory store là <b>nơi lưu kinh nghiệm</b> để pipeline dùng lại.<br><b>Chốt miệng:</b> MEMRES đi từ đoán package → làm sạch tên pip → chọn version theo độ tin cậy → Docker kiểm thật; nó có đường tắt cho ca quen và có memory để retry bớt mù."},{"q":"Confidence cascade 6 mức của MEMRES gồm những gì?","cat":"memres","slide":"12","ord":33,"keys":"cascade 6 muc level version selection thu tu","a":"6 nguồn để chọn version, xếp từ RẺ+CHẮC (thử trước) tới ĐẮT+DỄ SAI (để cuối):<br>• <b>1. Session memory:</b> version đã giải thành công cho chính gói này trong batch/repo đang chạy. Tin nhất, free. Vd numpy vừa giải ở snippet trước thì dùng luôn.<br>• <b>2. Compatibility map:</b> bảng tương thích dựng sẵn (vd gói X thường đi với Python 3.7). Tra bảng, không cần tính.<br>• <b>3. Templates:</b> mẫu cấu hình phổ biến cho stack hay gặp (vd bộ scipy+numpy+matplotlib cho data science), lấy cả cụm.<br>• <b>4. Co-occurrence:</b> khai thác lịch sử gói nào hay đi cùng version nào, đoán numpy hợp với scipy đã chọn.<br>• <b>5. Heuristics:</b> khi 4 mức trên bí thì dùng quy tắc chung, ưu tiên bản mới nhất (semver), bản có wheel.<br>• <b>6. LLM:</b> cùng đường mới hỏi model (đắt, chậm, có thể sai).<br><b>Đa số ca dừng ở mức 1-4, hiếm khi tới LLM. Đây chính là lookup-first, LLM-last.</b>"},{"q":"Reflexion là gì? (nhóm cite ở tài liệu tham khảo số 7)","cat":"memres","slide":"12, 29","ord":34,"keys":"reflexion la gi shinn verbal reinforcement cite tai lieu khac gi pllm previous attempt history raw log reflection note structured memory prompt text","a":"Reflexion là kỹ thuật cho AI <b>tự rút kinh nghiệm bằng lời</b>. Sau mỗi lần làm sai, nó viết một ghi chú kiểu: “lần này hỏng vì X, lần sau tránh Y”, rồi đọc lại ghi chú đó ở lần thử sau. Điểm hay là học từ thất bại mà <b>không cần train lại model</b>, chỉ thêm memory bằng chữ. Nhóm cite tài liệu số 7: Shinn và cộng sự, 2023.<br><b>Vậy khác PLLM ở đâu, vì PLLM cũng có previous attempt?</b><br>• <b>Giống nhau:</b> cả PLLM và MEMRES đều đưa thông tin lần fail trước vào lần thử sau. Nên nếu nói rất rộng thì cả hai đều “có history”.<br>• <b>PLLM:</b> thường là <b>raw history trong prompt</b>: “đây là version đã thử, đây là error log, hãy đoán lại”. LLM tự đọc một cục text và tự suy tiếp. Nó có thể né lỗi, nhưng memory không tách thành module rõ, không có cascade confidence, và không có cơ chế chắc chắn bắt lần sau phải tránh một version/vùng version cụ thể.<br>• <b>MEMRES:</b> Reflexion biến failure thành <b>reflection note có chủ đích hơn</b>: lỗi gì, bài học gì, lần sau nên tránh gì. Note này được dùng trong build loop cùng các memory/cascade khác, nên tốt hơn “ném nguyên log vào prompt”. Nhưng nó vẫn là <b>chữ tự nhiên</b>: máy khó kiểm chứng, solver không bị ép bởi một luật formal.<br>• <b>CGAR:</b> đi thêm một nấc: biến lỗi thành <b>ràng buộc máy đọc được</b>, ví dụ <code>scipy &lt; 1.3</code>, HARD/SOFT/UPPER. Solver bắt buộc tuân theo, nên một lỗi có thể cắt cả vùng version, không chỉ nhắc LLM “lần sau cẩn thận”.<br><b>Ví dụ imread:</b><br>• PLLM: “scipy 1.7.3 fail vì cannot import imread, thử version khác đi”.<br>• MEMRES/Reflexion: “bài học: imread bị remove ở scipy mới, nên thử scipy cũ hơn”.<br>• CGAR: ghi luật <code>scipy &lt; 1.3</code> vào Store; solver loại luôn mọi <code>scipy >= 1.3</code>.<br><b>Chốt miệng:</b> PLLM nhớ log thô, MEMRES viết kinh nghiệm bằng lời, còn CGAR biến kinh nghiệm đó thành constraint có kiểu để solver bắt buộc làm theo."},{"q":"Mỗi prompt agent NHẬN vào gì, XUẤT ra gì? (mapping tiếng Việt các component)","cat":"prompt","slide":"B6/B7/B8","ord":17.9,"keys":"mapping component nhan vao input xuat ra output tieng viet nghia la gi candidate block constraint rule pick assignment reason regex type sig error log upper bound action target planner analyzer critic dich","a":"Dịch nghĩa từng ô ra tiếng Việt:<br><b>PLANNER (chọn version)</b><br>• Nhận vào:<br>&nbsp;&nbsp;- python_version = phiên bản Python đang nhắm (vd 3.7).<br>&nbsp;&nbsp;- candidate_block = danh sách version ứng viên mỗi gói (dấu * = bản có sẵn wheel).<br>&nbsp;&nbsp;- constraint_block = các version đã fail / cận trên đã học (để né).<br>&nbsp;&nbsp;- rule_pick = đáp án nháp mà solver logic đã chọn sẵn.<br>• Xuất ra:<br>&nbsp;&nbsp;- assignment = bộ version chọn cho từng gói (vd scipy=1.2.3, numpy=1.16.6).<br>&nbsp;&nbsp;- reason = lý do ngắn.<br><b>ANALYZER (đọc lỗi → ràng buộc)</b><br>• Nhận vào:<br>&nbsp;&nbsp;- assignment = bộ version vừa thử; python_version.<br>&nbsp;&nbsp;- regex_type, regex_sig = đoán sơ bộ của regex (loại lỗi + chữ ký lỗi).<br>&nbsp;&nbsp;- error_log = log lỗi Docker (cắt ngắn).<br>• Xuất ra:<br>&nbsp;&nbsp;- type = loại ràng buộc (HARD / SOFT / UPPER).<br>&nbsp;&nbsp;- package = gói bị lỗi.<br>&nbsp;&nbsp;- upper_bound = cận trên (nếu UPPER), hoặc null.<br>&nbsp;&nbsp;- reason = lý do.<br><b>CRITIC (khi bí → đổi chiến lược)</b><br>• Nhận vào:<br>&nbsp;&nbsp;- pattern = kiểu lỗi đang lặp; total_failures = tổng số lần fail.<br>&nbsp;&nbsp;- last_error_types = các loại lỗi gần đây.<br>&nbsp;&nbsp;- python_versions_tried = các Python đã thử.<br>• Xuất ra:<br>&nbsp;&nbsp;- action = continue / switch_python / mark_unfixable.<br>&nbsp;&nbsp;- target = Python đích (nếu đổi), hoặc null.<br>&nbsp;&nbsp;- reason = lý do.<br><b>Chốt: mỗi agent nhận (ngữ cảnh + nháp) và xuất một JSON gọn; tất cả input/output đều là JSON để máy đọc và kiểm được.</b>"},{"q":"Sao lại VIẾT prompt như thế? Mỗi khối/component trong prompt nghĩa là gì? (3 agent)","cat":"prompt","slide":"B6/B7/B8","ord":18,"keys":"prompt viet nhu the nao component khoi block y nghia sao lai ghi thiet ke design planner analyzer critic candidate rule pick regex guess json reason 3 agent moi thanh phan de lam gi cong thuc chung anti hallucination","a":"<b>Cả 3 prompt theo 1 khuôn:</b> (1) đưa đủ ngữ cảnh để LLM có căn cứ; (2) đưa sẵn một đáp án NHÁP để LLM soát lại chứ không nghĩ từ số 0; (3) ép trả JSON trong tập giá trị hợp lệ để chống bịa.<br>• <b>Planner (chọn version):</b> danh sách ứng viên (đánh dấu bản có wheel) để chọn trong danh sách sạch không bịa bản lạ; các bản đã fail để đừng lặp lại; nháp của solver (rule_pick) để LLM soát rồi ký; output JSON kèm reason để máy đọc được và ép LLM giải thích, đỡ chọn bừa.<br>• <b>Analyzer (đọc lỗi):</b> lỗi vừa xảy ra + version vừa thử để biết bối cảnh; đoán sơ bộ của regex để LLM chỉ xác nhận/sửa; luật cannot import name X thì gán UPPER + điền cận trên.<br>• <b>Critic (khi bí):</b> toàn cảnh chuỗi lỗi (bao nhiêu lần, loại gì, Python nào đã thử); ép chọn đúng 1 trong 3 action (continue/switch_python/mark_unfixable), không cho tự do bịa.<br><b>Vì sao đưa nháp sẵn (rule_pick/regex guess)?</b> Để LLM SOÁT thay vì SÁNG TÁC, ít bịa, nhanh, có phao nếu LLM trả rác.<br><b>Chốt: đưa đủ ngữ cảnh, đưa nháp để soát, ép JSON hợp lệ, bắt ghi lý do, đó là 4 nguyên tắc viết prompt của tụi em.</b>"},{"q":"Giải thích prompt Planner (backup B6): các khối và vì sao","cat":"prompt","slide":"B6/37","ord":19,"keys":"planner prompt giai thich khoi candidate constraint rule pick","a":"<b>Planner làm gì:</b> chọn 1 bộ version để đem đi Docker build.<br><b>Các component trong prompt:</b><br>• <code>{candidate_block}</code>: miền D đã dựng từ PyPI. Nó liệt kê version thật của từng package; dấu <code>*</code> nghĩa là bản có wheel/cài nhanh. Planner chỉ được chọn trong danh sách này để không bịa version.<br>• <code>{constraint_block}</code>: các bài học đã có trong Store, như version đã fail, combo đã hỏng, hoặc upper bound <code>scipy &lt; 1.3</code>. Component này nhắc Planner <b>không lặp lại lỗi cũ</b>.<br>• <code>{rule_pick}</code>: đáp án nháp do ConstraintSolver chọn bằng luật deterministic. Nó đã né constraint và thường là bản mới nhất/wheel-first còn sống.<br><b>Luật quan trọng:</b> nếu <code>rule_pick</code> an toàn thì trả lại luôn; LLM chỉ override khi có lý do rõ. Tức LLM đóng vai <b>reviewer/chốt phương án</b>, không sáng tác từ số 0.<br><b>Output:</b> JSON gồm <code>assignment</code> + <code>reason</code>; máy validate version có nằm trong candidate graph không.","codeblock":"You are the Planner agent in a dependency-resolution system.\nGoal: choose one version per package most likely to install AND import\nsuccessfully on Python {python_version}, given constraints learned from\nprevious failures this session.\nCandidate versions per package (newest first, wheel-available *):\n  {candidate_block}\nPast failures (do NOT repeat):  {constraint_block}\nRule-based solver's current pick:  {rule_pick}\nRules:\n- Pick ONE version per package from candidates above.\n- Prefer wheel-available (*) versions to avoid source builds.\n- Avoid versions in past failures. If rule pick is safe, return it.\nOutput ONLY valid JSON:\n{\"assignment\": {\"pkg\": \"X.Y.Z\", ...}, \"reason\": \"<short>\"}"},{"q":"rule_pick (nháp của solver) là gì? Để tăng ưu tiên à?","cat":"prompt","slide":"B6","ord":20,"keys":"rule pick nhap solver constraint solver la gi tang uu tien priority rule based chon version moi nhat hop le soat review mac dinh tin planner","a":"KHÔNG phải tăng ưu tiên. Trước khi gọi LLM, bộ giải rule-based (ConstraintSolver) đã tự tính ra một đáp án: chọn bản mới nhất còn hợp lệ cho mỗi package theo ràng buộc đã biết. Đáp án đó = rule_pick. Nhét vào prompt để LLM chỉ SOÁT: nháp này ổn không, ổn thì trả lại luôn, thấy lý do đổi thì mới sửa. LLM mặc định tin solver, đỡ nghĩ từ số 0, đỡ bịa. <b>Là bản nháp để review, không phải điểm ưu tiên.</b>"},{"q":"Giải thích prompt Analyzer (backup B7): vì sao có regex guess?","cat":"prompt","slide":"B7/38","ord":21,"keys":"analyzer prompt giai thich regex guess upper bound null","a":"<b>Analyzer làm gì:</b> đọc Docker fail log và biến lỗi thành constraint mới cho Store.<br><b>Các component trong prompt:</b><br>• <code>{assignment}</code> + <code>{python_version}</code>: bộ version vừa thử. Cần cái này để biết lỗi thuộc package/version nào, không đọc log lơ lửng.<br>• <code>{error_log}</code>: log Docker đã cắt gọn. Đây là bằng chứng thật để phân loại lỗi.<br>• <code>{regex_type}</code>/<code>{regex_sig}</code>: đoán sơ bộ của regex/classifier tĩnh, ví dụ thấy <code>cannot import name</code> thì gợi ý UPPER. Component này giúp LLM <b>xác nhận hoặc sửa</b>, thay vì suy từ con số 0.<br><b>Luật quan trọng:</b> <code>cannot import name X from PKG</code> thường là API removed → sinh UPPER, ví dụ <code>scipy &lt; 1.3</code>. Nếu không chắc cận trên thì trả <code>null</code>, thà thiếu còn hơn bịa constraint sai.<br><b>Output:</b> JSON gồm <code>type</code> HARD/SOFT/UPPER, <code>package</code>, <code>upper_bound</code> nếu có, và <code>reason</code>; type ngoài schema thì discard/fallback.","codeblock":"You are the Analyzer agent. A Docker build just failed.\nAssignment tried: {assignment_block}   Python: {python_version}\nRegex classifier guess: type={regex_type}, sig={regex_sig}\nError log (truncated):  {error_log}\nRules:\n- type in {HARD, SOFT, UPPER}.\n  HARD  = deterministic incompat (Python mismatch, no matching dist).\n  SOFT  = runtime error needing >= 2 observations (ImportError, ...).\n  UPPER = API removed in current version -> infer an upper bound.\n- \"cannot import name X from PKG\" -> type=UPPER, fill upper_bound.\n- upper_bound = LAST known-good version before X removed (null if unsure).\nOutput ONLY valid JSON:\n{\"type\":\"HARD|SOFT|UPPER\", \"package\":\"<pkg>\",\n \"upper_bound\":\"X.Y.Z|null\", \"reason\":\"...\"}"},{"q":"'Đoán sơ bộ của regex' trong prompt Analyzer là gì?","cat":"prompt","slide":"B7","ord":22,"keys":"regex guess doan so bo classifier bo loc re quet log loai loi hard soft upper cannot import name xac nhan sua analyzer token on dinh","a":"Trước khi LLM đọc lỗi, có một bộ regex rẻ tiền quét log và đoán nhanh lỗi này thuộc loại nào (HARD/SOFT/UPPER). Ví dụ regex thấy chữ cannot import name thì đoán UPPER. Đưa cái đoán đó vào prompt để LLM chỉ XÁC NHẬN hoặc SỬA, khỏi phân tích từ đầu. Regex lo ca dễ (nhanh, chắc), LLM soát lại ca log lạ. <b>Đỡ tốn token, ổn định hơn.</b>"},{"q":"Giải thích prompt Critic (backup B8): 3 action và các ngưỡng","cat":"prompt","slide":"B8/39","ord":23,"keys":"critic prompt giai thich action nguong 3 4 8 pivot","a":"<b>Critic làm gì:</b> chỉ nhảy vào khi hệ bị kẹt, cụ thể là <b>3 failure liên tiếp có cùng error_type</b> (<code>activation_threshold=3</code>).<br><b>Các component trong prompt:</b><br>• <code>{pattern}</code>: lỗi đang lặp kiểu gì, ví dụ repeated_SyntaxError hoặc repeated_ImportError.<br>• <code>{total_failures}</code>: tổng số lần fail của snippet hiện tại.<br>• <code>{last_error_types}</code>: 5 loại lỗi gần nhất, để biết lỗi lặp hay mixed.<br>• <code>{python_versions_tried}</code>: các Python đã thử, để biết có nên đổi sang 2.7 không.<br><b>3 action cố định:</b><br>• <code>continue</code>: còn hướng thử, cứ để Planner/Solver chọn tiếp.<br>• <code>switch_python</code>: SyntaxError lặp dưới Python 3 và chưa thử 2.7 → đổi sang 2.7.<br>• <code>mark_unfixable</code>: ImportError lặp với tổng failure ≥5, hoặc tổng failure ≥8 mà vẫn lỗi/mixed → dừng để khỏi phí Docker.<br><b>Lưu ý về wheel:</b> <b>không có wheel không tự động mark_unfixable</b>. Wheel chỉ là tín hiệu ưu tiên/cài nhanh; nếu chỉ có sdist thì pip vẫn có thể build, nhưng dễ timeout hơn.<br><b>Vì sao ép 3 action:</b> tập đóng để chống LLM bịa hành động lạ. Output JSON gồm <code>action</code>, <code>target</code> nếu đổi Python, và <code>reason</code>.","codeblock":"You are the Critic agent. The Planner has failed several attempts on\nthe current snippet; propose a strategic pivot.\nFailure pattern: {pattern} · total: {total_failures}\nrecent error types: {last_error_types}\npython versions tried: {python_versions_tried}\nAvailable actions (pick exactly one):\n- \"continue\"       : keep retrying, no structural problem.\n- \"switch_python\"  : likely Python 2/3 mismatch; try another Python.\n- \"mark_unfixable\" : structurally infeasible (private pkg, Py2-only), stop.\nRules:\n- Repeated SyntaxError under Py3+ and 2.7 not tried -> switch_python 2.7.\n- Repeated ImportError with > 4 failures -> mark_unfixable.\n- > 8 attempts, mixed errors -> mark_unfixable. Else -> continue.\nOutput ONLY valid JSON:\n{\"action\":\"continue|switch_python|mark_unfixable\",\n \"target\":\"<py|null>\", \"reason\":\"...\"}"},{"q":"Critic có 3 action nào? Tại sao đúng 3 mà không nhiều/ít hơn?","cat":"prompt","slide":"B8","ord":24,"keys":"critic 3 action ba hanh dong continue switch python mark unfixable tai sao dung 3 tap dong closed set chong bia thu them doi truc python bo cuoc","a":"<b>3 action:</b><br>• <b>continue</b> = chưa có tín hiệu phải đổi chiến lược, thử tiếp.<br>• <b>switch_python</b> = nghi lệch Python 2/3, ví dụ SyntaxError lặp dưới Python 3 và chưa thử 2.7.<br>• <b>mark_unfixable</b> = dừng sớm khi tín hiệu cho thấy khó cứu: package private/không có trên PyPI, API quá deprecated, ImportError lặp nhiều lần, hoặc đã gần hết budget.<br><b>Không wheel có bỏ luôn không?</b> Không. Không wheel <b>không đồng nghĩa bất khả thi</b>. CGAR ưu tiên bản có wheel vì cài nhanh; nếu chỉ có sdist/source thì pip vẫn có thể build, chỉ là rủi ro timeout/source-build cao hơn. Chỉ khi nó fail lặp/timeout/nằm trong pattern khó cứu thì mới có thể bị mark_unfixable.<br><b>Vì sao đúng 3:</b> khi bí chỉ có 3 hướng bản chất: thử tiếp / đổi trục Python / dừng. Ép chọn 1 trong 3 để chống LLM tự chế action lạ."},{"q":"Giải thích cơ chế gọi LLM (backup B4): budget, trigger, fallback","cat":"prompt","slide":"B4/35","ord":25,"keys":"llm call ollama budget token trigger 128 96 timeout fallback","a":"<b>Gọi thế nào:</b> HTTP POST tới Ollama Gemma-2 9B ở localhost:11434, format JSON, temperature 0.3.<br><b>Budget/trigger thật trong CGAR:</b><br>• Planner: token cap 128, chạy khi cần chốt assignment.<br>• Analyzer: token cap 128, chỉ chạy sau Docker fail.<br>• Critic: token cap <b>96</b>, chỉ fire khi <b>3 failure liên tiếp có cùng error_type</b> (<code>activation_threshold=3</code>).<br><b>Rule fallback của Critic:</b><br>• SyntaxError lặp dưới Python 3 và chưa thử 2.7 → <code>switch_python</code> target=2.7.<br>• ImportError lặp và tổng failure ≥5 → <code>mark_unfixable</code>.<br>• Tổng failure ≥8 mà vẫn lỗi → <code>mark_unfixable</code> để khỏi đốt build budget.<br><b>Fallback chung:</b><br>• HTTP timeout 60s, retry 1 lần.<br>• Empty/parse-fail → rule fallback hoặc discard output sai schema.<br>• Nếu Planner không ra assignment hợp lệ → dùng đường MEMRES/cascade thay vì để LLM chặn cả run.<br><b>Chốt: đây là cấu hình thật: Planner/Analyzer 128 token, Critic 96 token, Critic kích hoạt ở 3 lỗi liên tiếp cùng loại.</b>"},{"q":"Sao dám chắc đây là BÀI TOÁN RÀNG BUỘC? Thầy nói đây không phải ràng buộc thì sao?","cat":"rangbuoc","slide":"19","ord":1,"keys":"sao dam chac bai toan rang buoc constraint problem thay noi khong phai csp cegis constraint acquisition upper bound vi tu logic predicate tia mien prune search retry phan bien bao ve chung minh","a":"<b>Trả lời ngắn:</b> Em gọi đây là bài toán ràng buộc vì hệ phải chọn một bộ version sao cho không vi phạm các điều kiện đã biết.<br><b>Map vào bài của mình:</b><br>• <b>Biến cần chọn:</b> version của từng package xuất hiện trong import, và Python version nếu cần. Ví dụ import scipy, numpy → chọn scipy version, numpy version, Python version.<br>• <b>Miền giá trị:</b> các version thật lấy từ PyPI, đã lọc theo Python target, ưu tiên wheel, giữ top-8 để miền không nổ tổ hợp.<br>• <b>Ràng buộc:</b> ban đầu có thể ít hoặc rỗng. Sau mỗi Docker fail, Analyzer học thêm luật: version này cấm, combo này hỏng, hoặc upper bound như scipy &lt; 1.3.<br>• <b>Nghiệm:</b> một bộ gán version chạy qua Docker, ví dụ Python=3.7, scipy=1.2.3, numpy=1.16.6.<br><b>Nếu thầy nói “đây chỉ là search/retry”:</b> em sẽ nói đúng là có search, nhưng không phải retry mù. Điểm khác là failure sinh ra constraint tái dùng được. Ví dụ lỗi cannot import imread không chỉ cấm một bản scipy cụ thể; nó sinh luật scipy &lt; 1.3, nên solver cắt cả vùng version mới hơn trong một lần.<br><b>Nói cho chuẩn:</b> đây không phải CSP cổ điển nơi mọi constraint có sẵn từ đầu. Của em là <b>constraint acquisition</b>: Docker phát hiện lỗi, Analyzer biến lỗi thành constraint, rồi solver giải lại trên miền đã được prune.<br><b>Chốt miệng:</b> biến từ import, miền từ PyPI, constraint học từ Docker fail; vì thế gọi là constraint-guided resolution chứ không chỉ là retry."},{"q":"Giải thích Constraint Acquisition vs giải CSP thường","cat":"rangbuoc","slide":"19","ord":2,"keys":"constraint acquisition csp khac cegis hoc rang buoc an","a":"<b>CSP thường (giải bài ràng buộc cho sẵn):</b><br>• Ai đó ĐƯA SẴN đầy đủ ràng buộc, solver chỉ việc tìm nghiệm thỏa. Vd xếp lịch: ràng buộc A không trùng B cho trước.<br><b>Constraint Acquisition (cái CGAR làm):</b><br>• KHÔNG ai đưa ràng buộc sẵn, bắt đầu với 0 ràng buộc. Phải TỰ HỌC ràng buộc từ việc thử rồi bị máy chấm (Docker) báo sai.<br>• Vd không biết trước scipy &lt; 1.3; chỉ sau khi build 1.7.3 fail vì imread mới học ra luật đó.<br><b>Khác biệt cốt lõi: CSP = ràng buộc cho sẵn chỉ giải; CA = vừa học ràng buộc vừa giải.</b><br><b>CEGIS là gì</b> (Counterexample-Guided Inductive Synthesis, nôm na học từ phản-ví-dụ):<br>• Là cái khung mà CA dùng. Vòng: đề xuất 1 lời giải → đưa máy kiểm (verifier) → nếu sai, máy trả về 1 phản-ví-dụ (trường hợp cụ thể chứng minh lời giải sai) → dùng nó siết lại → đề xuất lại.<br>• Trong CGAR: lời giải = 1 bộ version; máy kiểm = Docker; phản-ví-dụ = lỗi build (imread mất) → biến thành ràng buộc → chọn lại. Đúng khung CEGIS.<br><b>Chốt: CGAR không giải CSP cho sẵn, mà học ràng buộc từ Docker theo kiểu CEGIS (học từ phản ví dụ).</b>"},{"q":"Giải thích 3 loại constraint: vì sao SOFT cần ≥2 lần, UPPER mạnh nhất?","cat":"rangbuoc","slide":"19","ord":4,"keys":"hard soft upper vi sao 2 lan confidence khac nhau","a":"<b>Trả lời ngắn:</b> 3 loại này khác nhau ở <b>độ chắc của tín hiệu lỗi</b> và <b>phạm vi bị cắt</b>.<br><b>1. HARD = cấm chắc một version/package.</b><br>• Dùng cho lỗi cài đặt/metadata rất rõ, ví dụ Python version không khớp <code>requires_python</code>, hoặc pip báo <code>No matching distribution</code>.<br>• Đây không phải lỗi do model đoán mơ hồ; cùng Python + cùng package version thì thử lại gần như vẫn hỏng.<br>• Vì vậy 1 lần quan sát là đủ để ghi “version này không dùng được trong môi trường này”, confidence 1.0.<br><b>2. SOFT = nghi ngờ, cần thấy lặp lại mới cấm.</b><br>• Dùng cho lỗi runtime/import chung chung, ví dụ <code>ImportError</code>, lỗi import phụ, lỗi build log chưa đủ rõ để suy ra một luật vùng.<br>• Một lần fail có thể do combo với package khác, do dependency phụ, do log thiếu ngữ cảnh, hoặc Analyzer đọc chưa chắc. Nếu cấm ngay thì dễ cấm oan version vẫn có thể chạy trong combo khác.<br>• Vì vậy SOFT chỉ là “điểm đáng né”; thấy cùng lỗi đủ lần (ví dụ ≥2) mới nâng thành cấm mạnh, confidence 0.8.<br><b>3. UPPER = mạnh nhất vì cắt cả vùng version.</b><br>• Dùng khi log cho thấy API đã bị gỡ/đổi tên, ví dụ <code>cannot import name imread from scipy.misc</code>.<br>• Từ đó suy ra luật dạng <code>scipy &lt; 1.3</code>. Solver không chỉ bỏ một bản fail, mà bỏ toàn bộ các bản <code>scipy ≥ 1.3</code>.<br>• Vì cắt được cả khoảng [ub, ∞), UPPER tiết kiệm nhiều Docker retry nhất; nên khi ablation bỏ UPPER thì mất nặng nhất (−68%).<br><b>Chốt miệng:</b> HARD là “chắc hỏng điểm này”, SOFT là “nghi hỏng, cần xác nhận”, UPPER là “học được cận trên nên cắt cả vùng”."},{"q":"Giải thích \"build fail không phí\" / vì sao né được CẢ VÙNG?","cat":"rangbuoc","slide":"16","ord":5,"keys":"fail khong phi ne vung diem khac memres monotone pllm memres so sanh 3 tool doan mo gach tung cham ca doan diem vung prune build dem so lan","a":"Cùng ví dụ imread chết từ scipy 1.3, ba tool xử lý khác nhau:<br>• <b>PLLM = đoán mò.</b> Hỏi LLM dùng bản nào, build, fail, lại hỏi, gần như quên mình đã thử gì. Thử lung tung, hay lặp lại.<br>• <b>MEMRES = gạch từng chấm.</b> Nhớ bản nào fail thì không thử lại, nhưng vẫn dò từng bản: 1.7.3 fail, 1.7.2 fail, 1.7.1 fail... mãi mới tới 1.2.3.<br>• <b>CGAR = gạch cả đoạn.</b> Đọc lỗi, hiểu imread mất từ 1.3, nên gạch luôn cả khoảng ≥1.3 và nhảy thẳng xuống 1.2.3 (2 build).<br>• Số build: PLLM nhiều nhất, MEMRES vừa, CGAR ít nhất.<br><b>Chốt: PLLM mò, MEMRES gạch từng chấm, CGAR gạch cả đoạn, vì chỉ CGAR hiểu lý do lỗi.</b>"},{"q":"Giải thích ví dụ imread từng bước: vì sao nhảy thẳng 1.7.3 → 1.2.3?","cat":"rangbuoc","slide":"18","ord":6,"keys":"vi du imread scipy 1.7.3 1.2.3 nhay thang upper","a":"Lần 1: build scipy 1.7.3 → <code>ImportError: cannot import name imread</code>. Analyzer nhận diện pattern \"cannot import name X\" = <b>API removed</b> → suy upper bound: imread còn tới 1.2, vậy <b>scipy &lt; 1.3 [UPPER]</b> → ghi Store. Lần 2: solver chọn bản <b>cao nhất thỏa &lt;1.3 và có wheel</b> = 1.2.3 → OK.<br>Không dò 1.7.2 → 1.7.1 → ... vì cả khoảng [1.3, 1.7.3] đã bị cận trên cắt <b>trong một bước logic</b>. 1 fail = 1 bước nhảy vùng, không phải 1 bước dò điểm."},{"q":"Thuật toán solver chạy như thế nào? (greedy + backtracking + odometer, K_solve 50)","cat":"rangbuoc","slide":"16, B1","ord":7,"keys":"thuat toan solver chay nhu the nao algorithm greedy backtracking odometer next assignment viable versions is_infeasible is_above_upper_bound combo exclude 50 max attempts k_solve khong docker logic pubgrub buoc step vong lap counterfactual","a":"<b>Input:</b> graph (mỗi package → ứng viên đã sort mới-nhất + wheel-first, top-8), Python version, exclude_combo (bộ vừa Docker-fail cần né).<br><b>Bước 1 - lọc viable mỗi package:</b> bỏ version nếu is_infeasible (HARD, hoặc SOFT đã ≥2 lần) hoặc is_above_upper_bound (≥ cận trên UPPER). Giữ thứ tự mới-nhất-trước. Luôn nhét chuỗi rỗng ở cuối làm phao (cài không pin version).<br><b>Bước 2 - greedy:</b> nhặt bản đầu (mới nhất còn sống) cho mỗi package, độc lập, được 1 bộ.<br><b>Bước 3 - kiểm bộ:</b> nếu bộ bị loại (is_combo_infeasible = từng fail cùng nhau, hoặc trùng exclude_combo) thì chạy odometer.<br><b>Bước 4 - odometer (_next_assignment):</b> duyệt các bộ có hệ thống, đổi package CUỐI nhanh nhất (như đồng hồ đo km: hàng đơn vị quay hết vòng thì hàng chục nhích 1). Mỗi bộ kiểm lại; tối đa 50 lần (max_attempts = K_solve). Hết 50 hoặc hết tổ hợp thì trả None.<br><b>Ví dụ:</b> scipy=[1.7.3,1.6,1.5], numpy=[1.21,1.20]. Greedy 1.7.3+1.21; fail thì đổi numpy trước (1.7.3+1.20); vẫn fail thì nhích scipy reset numpy (1.6+1.21)...<br><b>3 điểm nhấn:</b><br>• Thuần logic, KHÔNG Docker, micro giây → đây là K_solve ≤ 50 (khác K_build ≤ 10 tốn 180s).<br>• Store tỉa HARD/SOFT/UPPER/combo = counterfactual backtracking mà không chạy lại Docker.<br>• Không phải PubGrub đầy đủ (code tự ghi chú), greedy đơn giản là đủ vì quy mô nhỏ (thường dưới 10 package)."},{"q":"Thứ tự pipeline: chọn 8 trước hay ghép (50) trước? Build mấy bộ? Vì sao 8, vì sao 50?","cat":"rangbuoc","slide":"S14","ord":7.3,"keys":"thu tu pipeline order 8 truoc hay 50 truoc build may bo 1 bo khong phai 8 vi sao 8 vi sao 50 hang so ky thuat safety cap odometer top-8 top 8 mien D ghep loc thuc don","a":"<b>Thứ tự đúng (4 bước):</b><br>• <b>A. Dựng “thực đơn”/miền D trước:</b> mỗi gói lên PyPI → lọc cứng theo Python → ưu tiên wheel + version mới → giữ top-8. Số 8 xuất hiện ở đây, trước solver.<br>• <b>B. Prune bằng Store:</b> trong miền D, bỏ version bị cấm bởi HARD / SOFT≥2 / UPPER bound; combo fail thì cũng bị né.<br>• <b>C. Ghép 1 bộ (≤50 logical attempts):</b> solver chọn mỗi gói 1 version thành 1 assignment. Nếu assignment đầu bị loại, odometer quay sang assignment kế, tối đa 50 lần trên giấy.<br>• <b>D. Build thật:</b> Docker chỉ build <b>1 assignment</b> vừa chọn. Fail → học constraint → quay lại B/C.<br><b>2 điểm dễ nhầm:</b><br>• Top-8 là số candidate mỗi gói, không phải build 8 lần.<br>• K_solve=50 là số lần solver quay assignment logic, không phải 50 Docker build.<br><b>Vì sao 8:</b> heuristic cân bằng coverage và chi phí; đủ có buffer hơn top-5, nhưng không phình như top-20.<br><b>Vì sao 50:</b> đây cũng là <b>hằng số kỹ thuật tự chọn</b>, giống top-8. Bối cảnh là harness chỉ cho <b>1800s wall-clock</b>, trong khi số tổ hợp tăng rất nhanh theo số package. Nếu để quá ít, solver có thể dừng trước khi tìm được combo tốt sau khi prune; nếu để quá nhiều, bước duyệt tổ hợp trước-build sẽ phình ra và lấn budget Docker. Vì vậy nhóm em đặt 50 làm cap: đủ rộng để thử nhiều assignment trên giấy, nhưng vẫn chỉ đưa <b>1 assignment đáng thử nhất</b> sang Docker mỗi vòng. 50 không phải 50 lần build.<br><b>Chốt: top-8 trước để dựng miền; ≤50 để ghép trên giấy; Docker chỉ thử 1 bộ mỗi vòng.</b>"},{"q":"Solver ghép trên giấy là ghép cái gì? Ghép kiểu gì? Vì sao cần ghép?","cat":"rangbuoc","slide":"17","ord":8,"keys":"solver ghep tren giay la gi ghep cai gi kieu gi vi sao can assignment bo to hop greedy backtracking odometer nhieu package cung luc tuong thich hop nhau version chon dong thoi mam com","a":"• <b>Ghép cái gì:</b> thử gán cho mỗi package một version cụ thể, tạo thành 1 bộ (assignment). Vd scipy=1.2.3, numpy=1.16.6. Mỗi package có ~8 bản ứng viên (miền D đã lọc), solver ghép 1 bản mỗi package thành 1 bộ hoàn chỉnh.<br>• <b>Ghép kiểu gì:</b> greedy + backtracking. Lấy bản mới nhất còn hợp lệ mỗi package; nếu bộ đó phạm ràng buộc hoặc đã fail thì lùi lại đổi 1 package sang bản khác (như quay số đồng hồ). Mỗi lần ghép + kiểm tra là 1 attempt, tối đa 50.<br>• <b>Vì sao cần ghép:</b> phải chọn version cho NHIỀU package cùng lúc sao cho hợp nhau + hợp Python + không phạm ràng buộc. Không chọn từng cái độc lập được.<br>• <b>Ẩn dụ:</b> xếp mâm cơm, chọn món hợp nhau; thử xếp trên giấy, chọn mâm ngon nhất rồi mới nấu thật (Docker)."},{"q":"Dữ liệu PyPI lấy ở đâu, ở bước nào, khi nào gọi?","cat":"rangbuoc","slide":"S14/B1","ord":8.85,"keys":"pypi lay o dau buoc nao khi nao goi api json request source nguon mien D domain live cache phien session network mang top-8 top 8 requires_python wheel candidate graph builder stage 2.5 truoc solver rag khong bia version pypi json info releases urls filename packagetype bdist_wheel requires_python","a":"<b>Lấy ở đâu:</b><br>• Gọi thẳng API công khai của PyPI, mỗi gói 1 request: <code>https://pypi.org/pypi/&lt;tên gói&gt;/json</code>.<br>• Không có database riêng, không crawl trước, <b>lấy live ngay lúc chạy</b>.<br><b>PyPI JSON có dạng gì:</b><br>• Top-level thường có <code>info</code>, <code>releases</code>, <code>urls</code>, <code>last_serial</code>.<br>• <code>info</code>: metadata chung của package, như tên, version mới nhất, summary, <code>requires_python</code> mức package nếu có.<br>• <code>releases</code>: map từ version → danh sách file phát hành của version đó. Đây là phần CGAR dùng nhiều nhất.<br>• Mỗi file trong <code>releases[version]</code> có <code>filename</code>, <code>packagetype</code>, <code>python_version</code>, <code>requires_python</code>, <code>url</code>, <code>yanked</code>...<br><b>CGAR lấy cái gì từ JSON:</b><br>• Danh sách version thật = các key trong <code>releases</code>.<br>• Python compatibility = đọc <code>requires_python</code> của file/version rồi so với Python target.<br>• Có wheel Linux không = xem file nào có <code>packagetype=\"bdist_wheel\"</code> và filename kiểu <code>manylinux</code>/<code>musllinux</code>/<code>linux</code>.<br><b>Ở bước nào:</b><br>• Bước <b>2.5 CandidateGraphBuilder</b>, ngay trước khi solver ghép version.<br>• Đây là bước dựng miền D: PyPI JSON → lọc theo Python đang nhắm → ưu tiên wheel + version mới → giữ <b>top-8</b> mỗi gói.<br><b>Khi nào / mấy lần:</b><br>• Thường 1 lần cho mỗi gói, rồi <b>cache theo phiên</b>. Gói đã hỏi ở snippet trước trong cùng batch thì snippet sau dùng lại, không hỏi mạng nữa.<br><b>Khác PLLM/MEMRES ở đâu:</b><br>• Baseline kiểu PLLM/MEMRES thường để LLM suy package/version từ prompt, history, hoặc text context.<br>• CGAR không bắt LLM tự list version. Code parse PyPI JSON thành <b>candidate graph có cấu trúc</b>. Planner chỉ được chọn version nằm trong graph thật đó; bịa version ngoài PyPI thì bị reject/fallback.<br><b>Có vấn đề gì không?</b><br>• Trade-off nhỏ là phụ thuộc mạng và trạng thái PyPI live tại lúc chạy, nên hệ cache theo phiên để giảm request và ổn định trong batch.<br>• Nhưng đây là lựa chọn đúng vai: version tồn tại/không tồn tại là dữ kiện, nên để code đọc API; LLM chỉ làm phần reasoning/chọn lựa.<br><b>Chốt:</b> PyPI JSON là nguồn dựng miền D; CGAR đọc bằng code ở bước 2.5, lấy version + requires_python + wheel info, rồi ép agent chọn trong danh sách thật.","codeblock":"{\n  \"info\": {\n    \"name\": \"scipy\",\n    \"version\": \"1.11.4\",\n    \"requires_python\": \">=3.9\"\n  },\n  \"releases\": {\n    \"1.2.3\": [\n      {\n        \"filename\": \"scipy-1.2.3-cp37-cp37m-manylinux1_x86_64.whl\",\n        \"packagetype\": \"bdist_wheel\",\n        \"python_version\": \"cp37\",\n        \"requires_python\": \">=3.5\",\n        \"url\": \"https://files.pythonhosted.org/...\"\n      }\n    ],\n    \"1.11.4\": [\n      {\n        \"filename\": \"scipy-1.11.4-cp311-cp311-manylinux_2_17_x86_64.whl\",\n        \"packagetype\": \"bdist_wheel\",\n        \"python_version\": \"cp311\",\n        \"requires_python\": \">=3.9\"\n      }\n    ]\n  },\n  \"urls\": [\n    { \"filename\": \"...latest release files only...\" }\n  ],\n  \"last_serial\": 12345678\n}"},{"q":"Vì sao bước dựng miền D không dùng LLM? Vì sao top-8 là hợp lý?","cat":"rangbuoc","slide":"17","ord":9,"keys":"vi sao 0 llm top 8 deterministic it qua","a":"<b>Không dùng LLM</b> vì đây là việc tra cứu dữ kiện: version nào tồn tại trên PyPI, requires_python là gì, có wheel/source artifact nào. Code đọc metadata chính xác, nhanh, và không bịa version.<br><b>Top-8 nên nói là “hợp lý/thực dụng”, không nói là chứng minh đủ:</b><br>• Danh sách đã lọc Python, ưu tiên wheel và bản mới trước, nên nghiệm thường nằm gần đầu nếu chỉ cần bản mới nhất tương thích.<br>• Khi Analyzer học UPPER bound, miền được dựng/prune lại quanh vùng dưới cận. Ví dụ học <code>scipy &lt; 1.3</code> thì solver nhảy xuống vùng <code>&lt;1.3</code>, không dò từng bản mới hơn.<br>• Nếu top-8 bỏ sót, hệ vẫn có fallback không pin/cascade, nhưng không bảo đảm complete kiểu SAT/SMT.<br><b>Chốt: D là metadata job nên để code làm; top-8 là heuristic có thứ tự và có fallback, không phải định lý.</b>"},{"q":"Vì sao chọn đúng top-8? Sao không top-5 hoặc top-20?","cat":"rangbuoc","slide":"S14/S17","ord":9.02,"keys":"vi sao top 8 top-8 tai sao 8 khong 5 khong 20 tradeoff coverage chi phi to hop heuristic wheel newest upper bound fallback khong bao dam toan hoc","a":"<b>Trả lời ngắn:</b> top-8 là <b>hằng số kỹ thuật</b> để cân bằng giữa <b>độ phủ nghiệm</b> và <b>chi phí tổ hợp</b>, không phải định lý toán học.<br><b>Vì sao không top-5:</b><br>• Top-5 hơi hẹp: nếu package có nhiều release sát nhau, hoặc cần lùi vài version vì API bị gỡ, 5 bản có thể không đủ khoảng đệm.<br>• Top-8 cho thêm vài nấc lùi an toàn sau bản mới nhất/wheel-first mà vẫn nhỏ.<br><b>Vì sao không top-20:</b><br>• Không gian tổ hợp nổ rất nhanh: N package thì số bộ tối đa là <code>k^N</code>. Với 6 package: top-8 là <code>8^6 = 262k</code>, top-20 là <code>20^6 = 64M</code>. Docker không build hết, nhưng solver/backtracking và combo search vẫn phình mạnh.<br>• Nhiều bản rất cũ ít khả năng là nghiệm, lại hay thiếu wheel/source-build chậm, nên thêm quá sâu làm nhiễu nhiều hơn lợi.<br><b>Vì sao top-8 vẫn hợp lý:</b><br>• Danh sách không lấy ngẫu nhiên: đã lọc Python, sort <b>wheel-first + newest-first</b>. Nghiệm thường là bản mới nhất còn tương thích hoặc bản ngay dưới upper bound, nên nằm gần đầu.<br>• Khi học UPPER bound, miền được dựng lại quanh vùng mới. Ví dụ học <code>scipy &lt; 1.3</code> thì top-8 lúc sau lấy trong vùng <code>&lt;1.3</code>, không bị kẹt với top-8 ban đầu.<br>• Có phao không pin version ở cuối để pip tự chọn trong một số ca.<br><b>Nói thật nếu thầy dí:</b> top-8 là heuristic thực nghiệm/engineering choice, không bảo đảm complete như SAT solver. Nếu muốn chắc hơn có thể tăng lên top-12/top-16, nhưng trade-off là chi phí tổ hợp và thời gian tăng; trong benchmark hiện tại top-8 đã đủ tốt vì lỗi còn lại chủ yếu là package private/system/Python2/native, không phải do thiếu candidate thứ 9.<br><b>Chốt miệng:</b> top-8 không phải “số thần kỳ”; nó là điểm cân bằng: rộng hơn top-5 để có buffer, nhỏ hơn top-20 để không nổ tổ hợp, và được bù bằng sort thông minh + upper-bound động + fallback không pin."},{"q":"Miền D cắt top-8: nếu version đúng nằm thứ 9 thì sao? Có bỏ sót nghiệm không?","cat":"rangbuoc","slide":"S14","ord":9.05,"keys":"top-8 top 8 cat mien D bo sot nghiem thu 9 version dung ngoai wheel moi truoc tran dong fallback khong ghim khong cat mu importera importerror khong phai khong giai duoc so sot coverage","a":"<b>Lo ngại hợp lý: cắt không gian thì luôn có rủi ro bỏ sót nghiệm.</b><br><b>Vì sao rủi ro top-8 thấp:</b><br>• <b>Không cắt bừa:</b> danh sách được sort theo wheel-first + newest-first. Nghiệm thường là bản mới nhất còn tương thích, hoặc bản ngay dưới upper bound vừa học, nên hay nằm gần đầu danh sách.<br>• <b>Trần là động:</b> khi học <code>scipy &lt; 1.3</code>, miền ứng viên được dựng lại trong vùng <code>&lt;1.3</code>; top-8 lúc này không còn bị phí slot cho các version đã bị cấm.<br>• <b>Có phao không ghim version:</b> solver luôn giữ lựa chọn cài không pin version ở cuối danh sách để pip tự chọn trong một số ca, giúp giảm rủi ro kẹt cứng vì top-k.<br><b>Nói thẳng:</b> top-8 là heuristic, không phải chứng minh đầy đủ như SAT/SMT. Nếu muốn tuyệt đối không b
